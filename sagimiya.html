<script>

  MB1:'贋作の台帳の最後のページ――「地下道　鉄扉　四・一・七」。収蔵庫の本物は、四枚目の「温室の少女」。',

  ['b0','東棟　収蔵庫',1],['b1','廊下の灯',2],['b2','中庭の火',2],['b3','手提げ金庫',2],
  ['c0','西棟　温室',1],['c1','秘書の部屋',2],['c2','縦穴',2],['c3','地下の部屋',2],
  ['d0','地下　ワインセラー',1],['d1','厨房',2],['d3','朝を待つ',2],['d2','鉄の扉',2],
  ['t0','大広間',1]
];

  ['c_mist','c0','b','毒の庭'],['c_tea','c1','b','静かなお茶'],['c1','c1','n','硝子の朝'],['c2','c2','b','縦穴'],['c3','c3','g','地下の光'],

Object.assign(N,{
a0:{chap:'a0',bg:'ext',ch:'',L:[

a1:{bg:'hall',ch:'',L:[

  '麗|秘書の東雲です。皆さま、どうぞお掛けください。',
  '千歳|……お、お茶を……お持ちしました。',
  'メイドの柊千歳は、カップを置く手がひどく震えていた。私と目が合うと、何か言いかけて、やめた。',
  '榊|では、始めます。故人の遺言を預かっております、弁護士の榊です。'],to:'a2'},
a2:{bg:'hall',ch:'',L:[
  '榊|「私の財産のすべては、葛城蒼の『最後の一枚』を、夜明けまでに見つけた者に譲る」',

  '榊|「絵は、東棟の収蔵庫、西棟の温室、地下のワインセラーのいずれかにある。三人はそれぞれ別の場所を探すこと。保険会社の立会人は、そのうち一人に同行すること」',
  '葛城蒼。十五年前に失踪した、天才と呼ばれた画家だ。',

  '鍵はそれぞれの手に渡った。紗夜は東棟。ひなたは西棟。カレンは地下。三人が、私を見ている。'],
  C:[{t:'紗夜と、東棟の収蔵庫へ',to:'b0'},{t:'ひなたと、西棟の温室へ',to:'c0'},{t:'カレンと、地下のワインセラーへ',to:'d0'},
     {t:'その前に、ひとりで離れの焼け跡を見ておく',to:'a_bad'},

  C:[{t:'一枚目　ルノワール風の裸婦',to:'b_gas'},{t:'二枚目　モネ風の睡蓮',to:'b_gas'},{t:'三枚目　セザンヌ風の静物',to:'b_gas'},{t:'四枚目　温室の少女',to:'b_open'},{t:'五枚目　ゴッホ風の糸杉',to:'b_gas'},{t:'もう少し調べる',to:'b0r'}]},

  '彼女は背伸びをして、私の唇に、そっと唇を重ねた。煙と、白檀の香りがした。',
  '!その肩ごしに、私は見た。炎の向こうに立つ、白い仮面を。',

  '潮の匂い。地下道は入り江に続いていた。小舟が一艘。綱を切り、暗い海へ漕ぎだす。',
  'ふり返ると、館の窓が、ひとつ、またひとつと赤くなっていった。',
  'ひなた|……止められなかった。あたしたちだけ、逃げて……。',
  '彼女は父の絵を胸に抱いていた。夜明けの海は、ひどく静かだった。'],
  end:{id:'c3',hint:'五時の火は、配電盤で止められる。そして、あの暗証の日付で開くものが、東棟にあったはずだ。'}},

d0:{chap:'d0',bg:'cellar',ch:'karen',reset:'cold',L:[
  '石の階段を下りる。カレンのヒールの音が、やけに大きく響いた。',
  'カレン|ねえ調査員さん。あたしを選んだのは、ドレスのせい？　それとも、いちばん怪しいから？',
  'ランプの灯りに、何百本という瓶が浮かび上がる。ワインセラーは、思ったより広い。',
  'カレン|正直に言うわ。あたし、モデルなんかじゃない。父は画商だったの。玄一郎から買ったモネが贋作で、店も信用も失った。……首を、吊ったわ。',
  'カレン|証拠をつかみに来たのよ。この体を使ってでもね。',
  '彼女は笑ったが、目は笑っていなかった。',
  '!階段の上で扉が閉まり、かんぬきの落ちる音がした。',
  '同時に、足もとに冷たいものが触れた。水だ。石の継ぎ目から、海水がしみ出している。',
  'カレン|……満ち潮。ここ、海より低いのよ。放っておけば、天井まで来るわ。'],C:DH},
d0r:{bg:'cellar',ch:'karen',limit:{max:6,to:'d_tide'},L:['水かさが増していく。（動けるのは、あと {cold} 手）'],C:DH},
d_rack:{bg:'cellar',ch:'karen',L:[
  'いちばん奥の棚だけ、造りがちがう。瓶には銘柄ではなく、年号だけの札。二〇〇五年から二〇一二年まで。',
  '棚の上に、真鍮の板。「はじまりの年を引け」',
  '棚の裏から、かすかに風が来る。この向こうに、空間がある。'],to:'d0r'},
d_crate:{bg:'cellar',ch:'karen',L:[
  '水に浮きかけた木箱に、古い伝票が貼りついていた。',
  '「絵画一点　初出荷　二〇〇九年　秋」',
  'ワインの伝票ではない。ここは、絵の出荷場でもあったのだ。'],to:'d0r'},
d_karen:{bg:'cellar',ch:'karen',L:[
  'カレン|贋作が最初に市場に出たのは、画家の葛城蒼が消えた、ちょうど次の年よ。調べたもの。',
  'カレン|つまり玄一郎は、彼を手に入れて、一年で商売を始めたってこと。……すべての始まりは、蒼が消えた年。'],to:'d0r'},
d_stair:{bg:'cellar',ch:'karen',L:[
  '階段を駆け上がり、扉に肩をぶつける。厚い樫の板は、びくともしなかった。',
  '水は、もう足首を越えている。'],to:'d0r'},
d_pipe:{bg:'cellar',ch:'karen',L:[
  '壁を這う古い配管。たどってみたが、天井の中へ消えているだけだった。',
  'カレンのドレスの裾が、黒く水を吸っている。'],to:'d0r'},
d_code:{bg:'cellar',ch:'karen',L:['年号の札のついた瓶。どの年を引く？　四けたで決める。'],code:{ans:'2008',ok:'d_open',ng:'d_ng',cancel:'d0r'}},
d_ng:{bg:'cellar',ch:'karen',addcold:1,L:['ちがう瓶だった。棚は動かない。水が、また少し上がった。'],to:'d0r'},
d_tide:{bg:'cellar',ch:'karen',L:[
  '水は胸まで来ていた。ランプが消える。',
  'カレンは私の首に腕を回し、濡れた体を押しつけてきた。震えている。寒さだけではない。',
  'カレン|……ばかみたい。復讐しに来て、ワインといっしょに沈むなんて。',
  'カレン|ねえ。最後に、だれかに抱いていてほしかったの。あなたで、よかったわ。',
  '冷たい唇が、私の唇をふさいだ。水が、その上を静かに覆っていった。'],
  end:{id:'d_tide',hint:'「はじまり」は、最初の出荷の年ではない。その一年前に、何があった？　動ける手数にも限りがある。'}},
d_open:{bg:'tunnel',ch:'karen',L:[
  '二〇〇八年の瓶を引く。奥で、歯車の回る音。',
  '!棚が、扉のように手前へ開いた。',
  '向こうは、上り坂の地下道だった。水はここまでは来ない。カレンが濡れたヒールを脱ぎ、裸足になる。',
  '五十メートルほど進むと、鉄の扉に突きあたった。三けたのダイヤル錠。',
  'カレン|……行き止まり、ね。番号なんて、知るわけないわ。'],C:DFORK},
d_fork:{bg:'tunnel',ch:'karen',L:['鉄の扉の前。'],C:DFORK},

d1:{chap:'d1',bg:'kitchen',ch:'chitose',L:[
  '地下道の途中に、狭い上り階段があった。配膳用の通路らしい。上りきると、厨房の食器棚の裏に出た。',
  '調理台の下に、だれかがうずくまっていた。メイドの千歳だ。',
  '千歳|ひっ……！　こ、殺さないで……！',
  'カレン|落ちついて。あたしたちよ。',
  '千歳は私の顔を見ると、堰を切ったように話しはじめた。',
  '千歳|わたし、六年間、運んでたんです。お食事を。地下の……先生のところへ。だれにも言うなって、旦那さまに。',
  '千歳|先生は、やさしい方でした。わたしに絵を教えてくれて。……先月、亡くなったんです。朝、お食事を持っていったら、もう。',
  '千歳|旦那さまは、泣きもしませんでした。その夜、先生を離れへ運んで……それから、火が。',
  '!焼け跡の遺体は、鷺宮玄一郎ではない。',
  'カレン|……じゃあ、玄一郎は。',
  '千歳|わ、わかりません！　でも今夜、だれもいないはずの廊下で、足音が……！'],
  C:[{t:'千歳を連れて、三人で逃げる',to:'d1a'},{t:'千歳をここに隠し、足音の主を追う',to:'d1b'}]},
d1b:{bg:'kitchen',ch:'',L:[
  '久我|ここを動かないで。すぐ戻る。',
  'カレンと二人、廊下へ出る。足音は、たしかに聞こえた。角の向こうへ、遠ざかっていく。',
  '追って、追って――それが誘いだと気づいたのは、厨房のほうから悲鳴が上がったときだった。',
  '!駆けもどる。千歳は、調理台の下で動かなくなっていた。顔に、白い仮面。',
  'カレン|……あたしたち、餌にされたのよ。',
  '背後で、厨房の扉が閉まった。ガスの元栓が開く、しゅう、という音。'],
  end:{id:'d1b',hint:'今夜は、だれも一人にしてはいけない。'}},
d1a:{bg:'ext',ch:'chitose',L:[
  '三人で勝手口へ向かう。千歳は私の袖をつかんで離さなかった。小さな手だ。',
  '外は嵐。道はまだ海の下。私たちは庭の木立の陰で、身を寄せあって朝を待った。',
  'カレンが、濡れたドレスのまま私の肩にもたれた。千歳は反対側で、私の腕を抱えて震えている。',
  'カレン|……両手に花ね、調査員さん。こんな夜じゃなきゃ、よかったのに。',
  '!午前五時。館の窓という窓から、いっせいに火が噴いた。',
  '千歳|お嬢さまたちが……まだ中に……！',
  '行こうとする彼女を、カレンと二人で押さえた。もう、だれにも近づけない火だった。',
  '夜明け。潮が引き、道が現れた。私たちは三人で、それを渡った。',
  '千歳|……先生は、地下のお部屋で、ずっと絵を描いておられました。最後の一枚を。わたし、あれを、だれかに見てほしかった。'],
  end:{id:'d1',hint:'焼けたのは別人だった。なら「死んだはずの男」はどこにいる？　鉄の扉の番号は、館のどこかに書かれているはずだ。'}},

d3:{chap:'d3',bg:'tunnel',ch:'karen',L:[
  'カレン|水はここまで来ないわ。朝まで待ちましょ。……ほら、一本くすねてきたの。二〇〇八年。',
  '栓を抜き、瓶のまま回し飲みする。彼女は濡れたドレスの肩を落とし、私の上着を羽織った。',
  'カレン|あったかい。……ねえ、もっとこっちへ来て。寒いの。',
  '白い肩。金色の髪が、私の首すじをくすぐる。ワインは甘く、彼女の唇はもっと甘かった。',
  '……どれくらい、眠っただろう。',
  '!目を開けると、両手が配管に縛られていた。',
  '上着の内ポケットにあったはずの、保険会社の調査書類がない。',
  '石の床に、口紅で一行。\n「ごめんね。あたしにも、ゆずれないものがあるの」',
  '遠くで、何かが爆ぜる音。煙が、地下道を這ってくる。'],
  end:{id:'d3',hint:'彼女は敵ではない。だが、目的のためなら何でもする人だ。鉄の扉を開けられれば、流れは変わる。'}},

d2:{chap:'d2',bg:'atelier',ch:'karen',L:[
  '四、一、七。錠が外れた。',
  'カレン|……あなた、何者？',
  '扉の向こうは、部屋だった。寝台。小さな机。壁いっぱいの絵の具の跡。そして、イーゼルに布をかけた一枚。',
  '人が、ここで暮らしていた。長いあいだ。それも、ごく最近まで。',
  'カレンが布を取った。温室に立つ、若い女性の絵。ひなただ。',
  'カレン|蒼の筆よ。まちがいない。絵の具が、まだ新しい。……生きてたのね、ここで。ひと月前まで。',
  '!では、ひと月前に焼けた遺体は、だれだ。',
  '部屋の隅に、荷物用の昇降機があった。縦穴の上は、鉄の格子。内側のレバーを引くと、格子の掛け金が外れる仕組みだ。上は――温室らしい。'],mem:'MD1',to:'d2b'},
d2b:{bg:'atelier',ch:'karen',L:[
  'そのとき、壁の向こうから声がした。通気口だ。私たちは息を殺した。',
  '男の声|……五時だ。配電盤から火が出る。古い館の漏電。だれも疑わん。',
  '麗の声|保険金は、私の会社に。旅券も整いました。……私たちは、入り江の舟で。',
  '男の声|ああ。お前は先に行って、舟で待て。',
  '足音がひとつ、遠ざかる。残った男が、低く笑った。',
  '男の声|舟は一人乗りだよ、麗。……お前も、知りすぎた。',
  '!鷺宮玄一郎は、生きている。'],mem:'MD2',to:'d2c'},
d2c:{bg:'atelier',ch:'karen',L:[
  'カレンは震える手で、小さな録音機を止めた。',
  'カレン|……録れたわ。全部。',
  '!通気口の向こうで、声が止まった。',
  '男の声|――そこに、だれかいるな。'],
  C:[{t:'地下道を、入り江へ向かって走る',to:'d2x'},{t:'館へ戻り、みんなに知らせる',to:'d2y'}]},
d2y:{bg:'tunnel',ch:'',L:[
  '知らせなければ。五時まで、まだ時間はある。私たちは配膳用の階段へ走った。',
  '!階段の上に、白い仮面が立っていた。猟銃の銃口が、こちらを向いている。',
  '仮面の男|この館の通路は、私が造らせた。お前たちがどこへ出るか、私には分かる。',
  'カレンが私の前に出た。止める間もなかった。',
  '銃声は、二度、響いた。'],
  end:{id:'d2y',hint:'この館の中では、彼のほうが速い。知らせるなら、彼が動きだす前――最初からだ。'}},
d2x:{bg:'cove',ch:'karen',L:[
  '潮の匂いのするほうへ走る。背後で鉄扉が開く音。銃声。石のかけらが頬を切った。',
  '入り江に、小舟が一艘。カレンが綱を解き、私が櫂を取る。',
  '岸で、白い仮面が立ちつくしていた。もう一発。弾は水を叩いただけだった。',
  '沖へ出て、やっと息をついた。カレンは録音機を胸に抱いて、笑って、それから泣いた。',
  'カレン|父さん……取ったわよ。証拠。',
  '彼女は私の首に腕を回した。濡れた髪。塩からい唇。',
  '!そのとき、岸のほうが赤く光った。五時だ。',
  'カレン|……あの子たち、まだ中にいるのに。',
  '証拠はある。だが、館には人が残っている。舟は、もう戻れないところまで流されていた。'],
  end:{id:'d2x',hint:'証拠は取れた。だが、守れなかった人がいる。地下の部屋から温室へ上がれることを、覚えておこう。'}}
});

/* ===== 最後の道 と 後日談 ===== */

Object.assign(N,{
t0:{chap:'t0',bg:'hall',ch:'',bgm:'tension',L:[

  C:[{t:'「東棟の収蔵庫へ。見せたいものがあります」',to:'t1'},{t:'「その前に、東雲さんを縛っておきます」',to:'t_bad1'}]},

t1:{bg:'gallery',ch:'saya',bgm:'tension',L:[

t1ng:{bg:'gallery',ch:'saya',L:['開かない。……あの画家が、すべての暗証にした日付だ。'],to:'t1'},
t1b:{bg:'gallery',ch:'rei',bgm:'tension',L:[
  '!蓋が開いた。保険証券。受取人の会社の代表は、東雲麗。そして、先月発行の、別名の旅券。写真は、鷺宮玄一郎。',
  '全員の目が、麗に集まった。彼女は、初めて顔色を変えた。',

t2:{bg:'green',ch:'hina',bgm:'tension',L:[
  '温室。扉の錠が下り、甘い霧が漂いはじめる。私は口をおさえ、まっすぐ石のベンチへ歩いた。',

t2ng:{bg:'green',ch:'hina',L:['動かない。……子守歌の、花の順だ。'],to:'t2'},
t2b:{bg:'green',ch:'hina',bgm:'calm',L:[
  '!座面が浮き、霧が止まった。',
  'スケッチブック。手紙の束。「ひなたへ」。差出人、葛城蒼。付箋には、東雲の名。',
  'ひなた|……お父、さん……？',
  '彼女は一通目の封を切り、三行読んで、その場にしゃがみこんだ。紗夜が黙って隣に膝をつき、妹の肩を抱いた。',
  '紗夜|ごめんなさい、ひなた。私、何も知らなかった。あなたのお父さまが、足の下にいたなんて。',

  '久我|ひと月前に焼けたのは、葛城蒼さんの遺体です。玄一郎は自分の死を偽装した。そして今夜、知っている者を全員、館ごと焼くつもりだ。午前五時に。',
  '榊|ば、ばかな……私は、ただ書類を作れと言われただけで……！',

  C:[{t:'麗に、玄一郎の本心を伝える',to:'t3'},{t:'榊に麗を見張らせ、配電盤へ急ぐ',to:'t_bad2'}]},
t_bad2:{bg:'dark',ch:'',L:[
  '時間がない。私は榊に麗を見張らせ、ほかの全員を連れて配電盤へ急いだ。',
  '途中で、背後から榊の叫び声。駆けもどると、弁護士は床に倒れ、麗の姿は消えていた。',

  '!三分後、館じゅうの灯りが落ちた。そして、配電盤のほうで火花。予定は、早められた。',
  '闇と煙の中で、だれかの手が、私の手から離れていった。'],

t3:{bg:'green',ch:'rei',bgm:'calm',L:[
  '久我|東雲さん。入り江の舟は、一人乗りです。',
  '麗|……何を。',

t4:{bg:'panel',ch:'',bgm:'danger',L:[

t_bad3:{bg:'panel',ch:'',L:[

t5:{bg:'hall',ch:'',bgm:'danger',L:[
  '白い線を切る。時計の針が、止まった。',

  '玄一郎|私は蒼に場所を与え、絵の具を与え、娘まで育ててやった。あの男の絵に値段をつけたのは、この私だ。',

t_bad4:{bg:'hall',ch:'gen',L:[
  '一歩、前に出たのを見て、玄一郎の目が冷えた。',
  '玄一郎|お前に言われる筋合いはない。私にとっては、だれもかれも“商品”のひとつにすぎん。',
  '!銃声。',

t6:{bg:'hall',ch:'saya',bgm:'none',L:[
  '紗夜が、前へ出た。まっすぐ、銃口に向かって歩いていく。',
  '紗夜|撃てるなら、撃って。お父さま。',
  '玄一郎|……下がれ、紗夜。お前だけは――',
  '紗夜|私は十年、あなたの嘘を着て生きてきた。このドレスも、この名前も。……もう、脱ぐわ。全部。',
  '!銃口が、わずかに下がった。その一瞬。',

  '私は男に体当たりした。カレンが銃を蹴り飛ばし、千歳が――あの千歳が――カーテンの紐で、主人の手首を縛りあげた。',

t7:{bg:'cove',ch:'',bgm:'dawn',L:[
  '午前六時。潮が引き、道が現れた。朝日の中を、警察の車が渡ってくる。',

  '紗夜|ええ。そうしましょう。',
  'カレンが空を仰いで、長い息を吐いた。麗は警官の前に、自分から両手を差し出した。千歳は、泣きながら笑っていた。',

ep_saya:{bg:'cove',ch:'saya2',bgm:'dawn',L:[

ep_hina:{bg:'cove',ch:'hina',bgm:'dawn',L:[

ep_karen:{bg:'cove',ch:'karen',bgm:'dawn',L:[

ep_chitose:{bg:'cove',ch:'chitose',bgm:'dawn',L:[

  '千歳|先生に、教わったんです。描きたいものを、描きなさいって。……わたし、ゆうべ、初めて描きたいものができて。',

ep_rei:{bg:'cove',ch:'rei2',bgm:'dawn',L:[

a1h:{bg:'hall',ch:'',L:['遺言の開封は九時。それまで、一時間ある。私は館の中を歩いてみることにした。'],C:AH},

a1z:{bg:'hall',ch:'',L:[
  '九時。全員が、大広間の席についた。雨が窓を叩いている。',

ah_saya:{bg:'room',ch:'saya',L:[
  '音楽室。紗夜はグランドピアノの前に座り、鍵盤の蓋に手を置いたまま、動かなかった。',
  '紗夜|弾きませんよ。この館では、子どものころから、音を立てるなと言われて育ちましたから。',

  '紗夜|調査員さん。父は本当に、あの火事で死んだのかしら。……いいえ、忘れてください。娘の言うことではないわ。'],to:'a1r'},
ah_hina:{bg:'hall',ch:'hina',L:[

  'ひなた|あ、調査員さん。ちょっと、じっとしてて。',

  'ひなた|よし。お葬式みたいな顔してたから。……あ、お葬式みたいなものか、今夜は。',
  'ひなた|あたしね、七つのとき、ここに来たんです。本当の親のことは、何も覚えてないの。でも、さびしくなかったな。温室にいると、だれかに見守られてる気がして。',
  'そう言って笑う顔に、嘘はなかった。'],to:'a1r'},
ah_karen:{bg:'hall',ch:'karen',L:[

  'カレン|一杯どう？　毒は入ってないわよ。たぶんね。',
  '久我|仕事中なので。',
  'カレン|まじめ。……ねえ、あたしがどうして候補に入ってるか、不思議でしょ。愛人だったと思う？',
  '彼女はカウンターに肘をつき、身を乗り出した。ドレスの胸もとから、目をそらす。',
  'カレン|ふふ。ちがうわ。あの人、あたしに指一本ふれなかった。ただ毎晩、あたしを椅子に座らせて、「だれかが描くから」って。',

ah_rei:{bg:'room',ch:'rei',L:[

  '麗|道が出るのは、明朝六時。それまでは、潮が満ちたままです。どなたも島を出られません。ご不便をおかけします。',

  '麗|本館におりました。離れから火が出ていると気づいたときには、もう。……旦那さまは、おひとりで絵をご覧になるのがお好きでしたから。',
  'よどみのない答えだ。練習したように。',

ah_chitose:{bg:'corridor',ch:'chitose',L:[

ah_pic:{bg:'hall',ch:'',L:[

b_shut:{bg:'gallery',ch:'saya',L:[
  '鉄のシャッターは、床の溝にぴったりはまっていた。持ち上げるどころか、指も入らない。',
  '紗夜|無駄よ。父は、自分の集めたものを、だれにも持ち出させなかった。絵も、人も。',

b_mother:{bg:'gallery',ch:'saya',L:[
  '紗夜|母は、私が九つのときに出ていきました。置き手紙に、一行だけ。「この家には、値段のつかないものの居場所がない」',
  '紗夜|私は残った。値段のつくほうに、なろうとしたの。成績も、ピアノも、この顔も。……父は一度も、ほめなかったけれど。',

b1y:{chap:'b1y',bg:'green',ch:'saya',L:[
  '紗夜|探しましょう。あの子たちを、置いていけない。',

  '紗夜はそれを拾い、黙って握りしめた。',
  '紗夜|……あの子が来た日、父は言ったの。「妹だと思うな、預かりものだ」って。私、ずっとそのとおりにしてきた。話しかけもしなかった。',
  '紗夜|なのにあの子、毎年、私の誕生日に花をくれるのよ。温室で育てた花を。',

b1y2:{bg:'cellar',ch:'karen',L:[

  'カレン|……おそいわよ。もう少しで、ワインの仲間入りだった。',

  '紗夜|番号なら――',
  '!階段の上で、灯りが消えた。',

  C:[{t:'三人で、棚の裏の地下道へ逃げこむ',to:'b1y_a'},{t:'階段を駆け上がって、突破する',to:'b1y_b'}]},
b1y_a:{bg:'cove',ch:'',L:[

  '扉の向こうは、だれかの部屋だった。寝台。イーゼル。だが、立ち止まっている時間はない。',
  '反対側の道は、入り江に続いていた。小舟が一艘。三人で乗るには小さすぎたが、迷っている暇もなかった。',
  '!沖へ出たとき、館の窓がいっせいに赤く光った。午前五時。',
  '紗夜|ひなた……！',
  '立ち上がりかけた紗夜を、カレンが抱きとめた。舟が大きく揺れる。',

  end:{id:'b1y',hint:'地下道の先に、だれかが暮らしていた部屋があった。次は立ち止まって、よく見てみたい。地下へ行く人に、最初から同行しよう。'}},
b1y_b:{bg:'dark',ch:'mask',L:[

  '!銃声。',

  '証券と旅券を机に置く。麗は長いあいだ、それを見ていた。',
  '麗|……よく、見つけられましたね。あの金庫は、旦那さまと葛城さんしか開けられないはずでした。',
  '麗|久我さま。取引をいたしませんか。保険金の三割。あなたは「不審な点なし」と報告なさるだけで結構です。',
  '久我|断ります。',
  '麗|……そうおっしゃると思いました。ですから、もう、お呼びしてあります。',
  '!背後で、床板が鳴った。'],
  end:{id:'b3y',hint:'今夜、ひとりで動く者から消えていく。証拠は、全員の前で見せるものだ。'}},

/* --- 西棟 --- */
c_flowers:{bg:'green',ch:'hina',L:[
  'ひなたが、口をカーディガンの袖でおさえながら、棚の鉢をひとつずつ指さす。',
  'ひなた|これはジギタリス。きれいでしょ。でも葉っぱは毒。こっちはスズラン。これも毒。あっちの夾竹桃も。',
  '久我|毒ばかりですね。',
  'ひなた|玄一郎さんが集めさせたの。「美しいものは、たいてい毒だ」って。……麗さんが、ときどき葉を摘みにくるんです。お茶にまぜる薬にするんだって。'],to:'c0r'},
c_sketch:{bg:'green',ch:'hina',L:[
  '最後のほうのページは、線が震えていた。描いた手が、弱っていたのだ。',
  '二十二歳の彼女。温室で、だれかに花を手渡している絵。相手の顔は、描かれていない。',
  '余白に、小さな字。「この子の花を、受けとってくれる人が現れますように」',
  'ひなたは、ちらりと私を見た。それからまっ赤になって、スケッチブックで顔を隠した。'],to:'c_fork'},
c1y:{chap:'c1y',bg:'court',ch:'hina',L:[
  '久我|朝までは待てない。出よう。',
  '椅子で窓を割る。二階だ。真下は温室のガラス屋根。鉄の骨組みの上なら、歩ける。',
  'ひなた|あたしが先に行く。どの梁が丈夫か、知ってるから。……手、つないでて。',
  '雨に濡れた鉄骨の上を、一歩ずつ。彼女の手は小さくて、熱い。',
  'ガラスの下に、温室の闇が広がっている。その中を、灯りがひとつ、動いていた。',
  '!白い仮面だ。床の格子を開け、何かを――だれかを、引きずり下ろしていく。',
  '弁護士の榊だった。もう、動いていない。',
  'ひなたの手が震えた。私は彼女の口を手でふさぎ、灯りが消えるまで、二人で鉄骨に伏せていた。',
  '庭に下りる。午前二時。館の中には、まだ紗夜とカレンがいる。'],
  C:[{t:'館へ戻り、紗夜を探す',to:'c1y_a'},{t:'道が出るまで、島の端の岩場に隠れる',to:'c1y_b'}]},
c1y_b:{bg:'ext',ch:'hina',L:[
  '館には戻れない。私たちは、島の端の岩場に身をひそめた。',
  'ひなた|ここなら、見つからないよね……。',
  '風が強い。彼女を上着でくるみ、抱きよせる。濡れた髪が、あごの下で震えていた。',
  '道が現れるのは、朝六時。……つまり、それまでは――',
  '!波が、足もとの岩を越えた。',
  '満ちてくる。戻ろうとしたときには、来た道はもう、黒い水の下だった。'],
  end:{id:'c1z',hint:'この島は、夜のあいだ潮が満ちる。低い場所は、どこも安全ではない。'}},
c1y_a:{bg:'room',ch:'saya',L:[
  '勝手口から館へ戻る。東棟の廊下。紗夜の部屋の扉には、外から椅子が噛ませてあった。',
  '椅子を外す。紗夜は窓ぎわに立っていて、私たちを見ると、初めて表情を崩した。',
  '紗夜|ひなた……！　無事だったの……。',
  'ひなた|お姉ちゃん、あたし……あたしね、お父さんが……。',
  '手紙の束を見せられ、紗夜は長いあいだ黙っていた。それから、妹の頭を、ぎこちなく胸に抱いた。',
  '紗夜|ごめんなさい。「預かりものだ」と言われて、私、そのとおりにしてきた。……でも、あなたがくれた花、一輪も捨てていないのよ。全部、押し花にしてあるの。',
  'ひなたは声を上げて泣いた。私は扉の前に立ち、朝を待った。カレンを探しにいく時間は、もう残っていなかった。',
  '!午前五時。廊下の奥が、赤く光った。',
  '窓から庭へ。三人は、燃える館を背に走った。',
  '夜明け。姉妹は手をつないだまま、焼け落ちる屋根を見ていた。',
  'ひなた|……カレンさんは。',
  'だれも、答えられなかった。'],
  end:{id:'c1y',hint:'姉妹は、やっと姉妹になれた。だが、全員ではない。仮面の男は、温室の床の格子を、下から出入りしていた。'}},
c3c:{bg:'cove',ch:'hina',L:[
  '私はひなたの手をつかみ、反対側の地下道へ走った。銃声。石の壁が砕ける。',
  '潮の匂い。地下道は入り江に続いていた。小舟が一艘。綱を切り、暗い海へ漕ぎだす。',
  'ふり返ると、館の窓が、ひとつ、またひとつと赤くなっていった。',
  'ひなた|……止められなかった。あたしたちだけ、逃げて……。',
  '彼女は父の絵を胸に抱いていた。夜明けの海は、ひどく静かだった。'],
  end:{id:'c3',hint:'五時の火は、配電盤で止められる。そして、あの暗証の日付で開くものが、東棟にあったはずだ。'}},
c3y:{bg:'atelier',ch:'mask',L:[
  '私は、ひなたを背中に隠した。',
  '仮面の男|……蒼の娘か。大きくなったものだ。上から見るのと、下から見るのとでは、ちがうな。',
  'ひなた|あなた……だれ。お父さんに、何をしたの！',
  '仮面の男|何も。場所と、絵の具と、十五年をやった。あの男は最期まで、お前の名を呼んでいたよ。うるさくてな。',
  '!銃声が、小さな部屋に響いた。'],
  end:{id:'c3y',hint:'彼に言葉は通じない――少なくとも、私たちの言葉は。逃げることは、負けではない。'}},

/* --- 地下 --- */
d_look:{bg:'cellar',ch:'karen',L:[
  'カレンは濡れた裾をしぼりながら、棚の瓶の年号を目で追っていた。こわがっているようには見えない。',
  'カレン|なに、じろじろ見て。……こわくないのかって？　こわいわよ。でもね、父が死んでから、こわいのには慣れたの。',
  'カレン|それより、手を貸して。ヒールじゃ、すべるのよ。',
  'つかんだ手は冷たく、少しだけ震えていた。'],to:'d0r'},
d_father:{bg:'tunnel',ch:'karen',L:[
  'カレン|父はね、目利きだったのよ。偽物なんか、一度もつかんだことがなかった。……あのモネ以外は。',
  'カレン|それくらい、よくできてたの。描いた人間は、本物の天才よ。皮肉よね。父を殺した絵を、あたし、きれいだと思ったんだから。',
  'カレン|だから知りたいの。葛城蒼って、どんな男だったのか。どうして、あんな男のために描いたのか。',
  '彼女は鉄の扉に、額をつけた。金色の髪が、錆の上に流れた。'],to:'d_fork'},
d1y:{bg:'tunnel',ch:'chitose',L:[
  '千歳|お部屋の扉の番号は、旦那さましかご存じありません。でも、配膳口なら……。',
  '配膳用の通路の突き当たり。壁に、盆が一枚通るだけの、小さな引き戸があった。',
  '千歳|毎日、ここから。先生は、手だけ出して、受けとってくださいました。……あたたかい、絵の具だらけの手でした。',
  'カレンが引き戸を開け、中をのぞきこむ。',
  'カレン|部屋があるわ。寝台と、イーゼル。布のかかった絵が一枚……待って。だれか、いる。',
  '!引き戸の向こうから、白い仮面が、こちらをのぞき返していた。',
  '小さな四角い穴から、猟銃の先が、ゆっくりと出てきた。狭い通路に、逃げ場はない。'],
  end:{id:'d1y',hint:'あの部屋には、正面の扉から入るしかない。番号は、館のどこかに書きとめられている。'}},
d2z:{chap:'d2z',bg:'green',ch:'karen',L:[
  '入り江へも、階段へも行かない。私はカレンの手をつかみ、荷物用の昇降機に飛び乗った。鎖をたぐる。',
  'レバーを引き、格子を押し上げる。上は、温室だった。甘いにおい。石のベンチのそばに、ひなたが倒れている。',
  '!息は、ある。',
  'カレンが彼女を抱き起こし、頬を叩いた。ひなたは咳きこんで、目を開けた。',
  'ひなた|……調査員、さん？　あたし、霧で……扉が、開かなくて……。',
  'カレン|もう大丈夫よ。……あなたのお父さん、いい絵を描くのね。',
  'ひなた|え……？',
  '説明している時間はない。五時に、配電盤から火が出る。それだけは、聞いた。',
  '三人で、大広間の裏へ走る。配電盤の扉には鍵。カレンが、髪からピンを一本抜いた。金色の髪が、ばさりと落ちる。',
  'カレン|父の店の金庫よりは、かんたんね。'],to:'d2z2'},
d2z2:{bg:'panel',ch:'',bgm:'danger',L:[
  '開いた。時計の文字盤。三本の電線。赤、青、白。針は、四時五十分。',
  'カレン|どれ！？'],
  C:[{t:'赤い線を切る',to:'d2w'},{t:'青い線を切る',to:'d2w'},{t:'白い線を切る',to:'d2z3',mem:'MC2'}]},
d2w:{bg:'panel',ch:'',L:[
  '迷っている時間はなかった。私は、一本を選んだ。',
  '!目の前が、まっ白になった。',
  '熱と、ガラスの割れる音。ひなたとカレンの声が、同時に私の名を呼んだ。それきりだった。'],
  end:{id:'d2w',hint:'ここまで来たのに、最後の一手が分からない。答えは、あの地下の部屋のどこかにあるはずだ。別の人と下りてみよう。'}},
d2z3:{bg:'hall',ch:'',bgm:'calm',L:[
  '白い線を切る。針が、止まった。',
  'カレンが私に抱きつき、ひなたがその上から抱きついた。三人で、床にへたりこむ。',
  '火は、出ない。館は燃えない。',
  '!だが、大広間に戻った私たちが見たのは、暖炉の前で仮面をかぶせられた榊の亡骸と、床に落ちた麗の眼鏡だった。',
  '夜明け。入り江から、小舟が一艘、消えていた。',
  '紗夜は、自分の部屋で見つかった。扉に椅子が噛ませてあった。無事だ。千歳も、厨房の戸棚の中で震えていた。',
  'カレン|録音はあるわ。あの男は、もうどこへも逃げられない。……でも。',
  '潮の引いた道の先を、彼女はにらんでいた。館は残った。娘たちも残った。それでも、仮面の男だけが、夜といっしょに消えていた。'],
  end:{id:'d2z',hint:'火は止めた。だが二人が消え、彼は逃げた。最初から全員が一緒にいれば、彼は動けなかったはずだ。'}},

/* --- 最後の道 --- */
t3b:{bg:'atelier',ch:'hina',bgm:'calm',L:[
  '麗|……お嬢さま。温室の床の格子の下に、葛城さんのお部屋がございます。お連れいたします。それが、私にできる、せめてものことです。',
  'レバーを引き、昇降機で二人ずつ下りる。寝台。小さな机。壁いっぱいの絵の具の跡。',
  'ひなたは、イーゼルの布を、自分の手で取った。温室に立つ、今の彼女。絵の中の彼女は、こちらを見上げて笑っていた。',
  'ひなた|……見てて、くれたんだ。',
  '千歳|先生は、毎日おっしゃっていました。「今日は、あの子の声がよく聞こえた」と。それだけで、その日は一日、筆が進むのだと。',
  '紗夜は、壁に残った絵の具の跡に、そっと指を当てた。',
  '紗夜|私が弾かなかったピアノの下で、この人は十五年、描いていたのね。……弾けばよかった。聞こえたかもしれないのに。',
  'カレン|……父を殺した絵を描いた男を、あたし、憎めそうにないわ。ずるいわね、絵って。',
  '麗は部屋の隅で、だれにも見られないように、眼鏡の下をぬぐっていた。',
  '机の上の配電図を、私は上着にしまった。四時四十分。急がなければ。'],to:'t4'}
});

      if(sg.dr===2){ if(q%8===0||q===10)kick(t); if(q%8===4)nz(t,0.12,0.15,1500); if(q%2===0)nz(t,0.03,0.05,7000); }
      else if(sg.dr===3){ if(q%4===0)nz(t,0.03,0.035,7000); if(q===0)kick(t); }
      bgm.step=(st+1)%(sg.ch.length*16); bgm.next+=sl; }
  }catch(e){}
}

function setSnd(on){ muted=!on; $('btnSnd').textContent=on?'🎵':'🔇'; $('btnSnd2').textContent='音楽と効果音：'+(on?'入':'切'); bgm.next=0; if(on){ ac(); seClick(); } }

/* ---------- 進行 ---------- */
var cur=null, li=0, flags={}, curChap='', typing=null, full='', shown=0, lastChoice=null, resetSnap=null, waitChoice=false, ended=false, toastT=null;
function count(o){ var n=0; for(var k in o)if(o[k])n++; return n; }
function all(a){ if(typeof a==='string')return !!flags[a]; for(var i=0;i<a.length;i++)if(!flags[a[i]])return false; return true; }
function hasMem(m){ if(typeof m==='string')return !!save.mem[m]; for(var i=0;i<m.length;i++)if(!save.mem[m[i]])return false; return true; }
function copy(o){ return JSON.parse(JSON.stringify(o)); }
function chapName(id){ for(var i=0;i<CHAPS.length;i++)if(CHAPS[i][0]===id)return CHAPS[i][1]; return ''; }
function setCh(k){ var c=$('chr'); if(k&&CH[k]){ c.innerHTML=CH[k]; c.style.opacity=1; } else { c.style.opacity=0; } }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.className='on'; clearTimeout(toastT); toastT=setTimeout(function(){ t.className=''; },3600); }
function resolve(to){ return Array.isArray(to)?(all(to[0])?to[1]:to[2]):to; }
function scene(n){ if(n.bg){ $('bg').innerHTML=BG[n.bg]||''; $('chr').setAttribute('class',DIM[n.bg]?'dim':''); } if(n.ch!==undefined)setCh(n.ch); bgm.want=n.bgm||BGMUSIC[n.bg]||bgm.want; }
function go(id){
  id=resolve(id); var n=N[id]; if(!n)return;
  if(n.reset)flags[n.reset]=0;
  if(n.addcold)flags.cold=(flags.cold||0)+n.addcold;
  if(n.limit&&(flags.cold||0)>=n.limit.max){ if(resetSnap)lastChoice=resetSnap; go(n.limit.to); return; }
  cur=id; li=0; waitChoice=false; ended=false;
  if(n.chap&&n.chap!==curChap){ curChap=n.chap; var old=save.chap[n.chap]; if(!old||count(flags)>=count(old))save.chap[n.chap]=copy(flags); save.last=n.chap; store(); }
  if(n.reset)resetSnap={node:id,flags:copy(flags),chap:curChap};
  $('box').className=''; $('chapName').textContent=chapName(curChap); scene(n); $('choices').innerHTML=''; line();
}
function line(){
  var n=N[cur], t=n.L[li], who='', bang=false, p;
  if(t.charAt(0)==='!'){ bang=true; t=t.slice(1); }
  p=t.indexOf('|'); if(p>0&&p<6){ who=t.slice(0,p); t=t.slice(p+1); }
  if(n.limit)t=t.replace('{cold}',Math.max(0,n.limit.max-(flags.cold||0)));
  if(WHO[who]){ var base=WHO[who], nc=n.ch||''; setCh(nc.indexOf(base)===0?nc:base); }
  if(bang){ var fx=$('fx'), sg=$('stage'); fx.className=''; sg.className=''; void fx.offsetWidth; fx.className='go'; sg.className='shake'; seSting(); }
  $('who').textContent=who; full=who?'「'+t+'」':t; shown=0; $('txt').textContent=''; $('more').hidden=false;
  clearInterval(typing); typing=setInterval(function(){ shown+=2; if(shown>=full.length){ shown=full.length; clearInterval(typing); typing=null; } $('txt').textContent=full.slice(0,shown); },22);
}
function next(){
  if(waitChoice||ended||!cur)return;
  if(typing){ clearInterval(typing); typing=null; $('txt').textContent=full; return; }
  var n=N[cur];
  if(li<n.L.length-1){ li++; line(); return; }
  if(n.set)flags[n.set]=1;
  if(n.mem&&!save.mem[n.mem]){ save.mem[n.mem]=1; store(); seMem(); toast('記憶を得た：'+MEM[n.mem]); }
  if(n.C)showChoices(n);
  else if(n.code)showCode(n);
  else if(n.end)showEnd(n.end);
  else if(n.to)go(n.to);
}
function showChoices(n){
  waitChoice=true; $('more').hidden=true; var box=$('choices'); box.innerHTML='';
  n.C.forEach(function(c){
    if(c.once&&flags[c.once])return; if(c.if&&!all(c.if))return; if(c.unless&&all(c.unless))return;
    var b=document.createElement('button'), locked=c.mem&&!hasMem(c.mem);
    if(locked){ b.className='lock'; b.disabled=true; b.textContent='🔒 ？？？（いまの私には思いつかない）'; }
    else { b.textContent=(c.mem?'◆ ':'')+c.t; b.onclick=function(e){ e.stopPropagation(); seClick(); lastChoice={node:cur,flags:copy(flags),chap:curChap}; if(c.once)flags[c.once]=1; if(c.set)flags[c.set]=1; if(c.cost)flags.cold=(flags.cold||0)+c.cost; go(c.to); }; }
    box.appendChild(b);
  });
}
/* 四けたの番号を入れる場面 */
function showCode(n){
  waitChoice=true; $('more').hidden=true; $('box').className='code'; var box=$('choices'); box.innerHTML=''; var val='';
  var disp=document.createElement('div'); disp.className='digits'; var pad=document.createElement('div'); pad.className='pad';
  function draw(){ disp.textContent=(val+'____').slice(0,4); }
  ['1','2','3','4','5','6','7','8','9','消す','0','決定'].forEach(function(k){ var b=document.createElement('button'); b.textContent=k; if(k==='決定')b.className='main';
    b.onclick=function(e){ e.stopPropagation(); seClick(); if(k==='消す'){ val=val.slice(0,-1); draw(); } else if(k==='決定'){ if(val.length<4)return; if(val===n.code.ans){ seGood(); go(n.code.ok); } else go(n.code.ng); } else if(val.length<4){ val+=k; draw(); } }; pad.appendChild(b); });
  var c=document.createElement('button'); c.textContent='やめる'; c.onclick=function(e){ e.stopPropagation(); go(n.code.cancel); };
  box.appendChild(disp); box.appendChild(pad); box.appendChild(c); draw();
}

}

      d.innerHTML='<span class="tag '+e[2]+'">'+KSHORT[e[2]]+'</span>'+(seen?e[3]:'？？？'); f.appendChild(d); });
  });
  var ml=''; MKEYS.forEach(function(k,i){ ml+=(i?'<br>':'')+(save.mem[k]?'◆ '+MEM[k]:'◇ ？？？'); }); $('memList').innerHTML=ml;
  wipeStep=0; $('btnWipe').textContent='記録をすべて消す';
  $('ovEnd').hidden=true; $('ovFlow').hidden=false;
}
$('fx').addEventListener('animationend',function(){ $('fx').className=''; });
$('box').onclick=next; $('stage').onclick=next;
window.addEventListener('keydown',function(e){ if((e.key===' '||e.key==='Enter')&&$('ovTitle').hidden&&$('ovEnd').hidden&&$('ovFlow').hidden){ e.preventDefault(); next(); } });
$('btnStart').onclick=startNew;
$('btnCont').onclick=function(){ if(save.last)jump(save.last); };
$('btnFlow').onclick=showFlow; $('btnFlow2').onclick=showFlow; $('btnEndFlow').onclick=showFlow;
$('btnFlowClose').onclick=function(){ $('ovFlow').hidden=true; if(!cur||ended)showTitle(); };

  $('box').className=''; $('chapName').textContent=chapName(curChap); scene(n); $('choices').innerHTML=''; line(); };

/* 点検用 */
window.__k={N:N,ENDS:ENDS,CHAPS:CHAPS,save:function(){return save;},flags:function(){return flags;},cur:function(){return cur;},go:go,next:next,start:startNew,jump:jump,bgm:bgm,
  opts:function(){ return Array.prototype.map.call($('choices').querySelectorAll('button'),function(b){return (b.disabled?'[x]':'')+b.textContent;}); },
