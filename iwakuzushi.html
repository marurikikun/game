html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);

.hud .st{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.hud .st b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .st span{font-size:14px;color:var(--fg-dim)}
.hud .goals{display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:16px;font-weight:700;white-space:nowrap}
.hud .goals .done{color:var(--ok)}
.hud .goals i{font-style:normal;color:var(--gold)}
.hud .mv{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;background:var(--panel-2);border-radius:8px;padding:2px 6px}
.hud .mv small{font-size:12px;color:var(--fg-dim)}
.hud .mv b{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}

button:active{transform:translateY(1px);filter:brightness(1.2)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar button{flex:1;min-width:0}
.bar #btnSnd{flex:0 0 56px}

/* ---------- 保存 ---------- */
var KEY='garagara_iwakuzushi_v1';

/* 見た目のサンプル3種類 */
var THEMES=[
 {name:'坑道',   bg0:'#2b2520',bg1:'#15110e',wall0:'#75624f',wall1:'#5a4a3b',strip:'#3d3229',pebs:['#8b8a88','#77736f','#9a958e','#6a6763','#857c73']},

 {name:'砂の遺跡', bg0:'#3a2f1f',bg1:'#1b150c',wall0:'#c7a56b',wall1:'#a07f4a',strip:'#5d4a2b',pebs:['#b49a78','#9c8262','#c4ad8c','#8b7355','#a89070']}

/* ---------- 音（はじめは切） ---------- */
var muted=true, actx=null, lastTick=0;
function tone(f,d,type,vol,slide){
  if(muted) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    var t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol||0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}
function sPop(n){tone(260+Math.min(n,10)*30,0.16,'triangle',0.16,120);}
var SONGS=(function(){
  var ch=[[48,0],[45,1],[41,0],[43,0],[48,0],[45,1],[41,0],[43,0]],
    mel=[76,0,79,0,84,0,79,0,76,0,79,0,0,0,0,0, 76,0,81,0,84,0,81,0,76,0,81,0,0,0,0,0, 77,0,81,0,84,0,81,0,77,0,81,0,79,0,77,0, 74,0,79,0,83,0,79,0,74,0,0,0,79,0,0,0,
         84,0,0,0,79,0,76,0,79,0,0,0,84,0,86,0, 88,0,0,0,84,0,81,0,84,0,0,0,81,0,0,0, 77,0,81,0,84,0,89,0,88,0,84,0,81,0,0,0, 79,0,83,0,86,0,0,0,83,0,79,0,0,0,0,0];
  return {play:{bpm:116,lead:'triangle',lv:0.085,arp:0.009,dr:1,ch:ch,mel:mel},menu:{bpm:92,lead:'sine',lv:0.085,arp:0,dr:0,ch:ch,mel:mel}};
})();
function bgmWant(){ return (status==='menu'||status==='end')?'menu':'play'; }
/* ===== BGM：音楽ファイルは使えないので、音を1つずつ鳴らして曲にする =====
   曲は「16分音符ごとの音の高さ」の表。ch=1小節ごとの和音[根音,短調なら1]、mel=メロディ（0は休み） */
var bgm={off:true,name:'',step:0,next:0,gain:null,nz:null};
function bgmOsc(m,t,d,type,vol){ var a=actx,o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.setValueAtTime(440*Math.pow(2,(m-69)/12),t); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.012); g.gain.setValueAtTime(vol,t+d*0.6); g.gain.exponentialRampToValueAtTime(0.0008,t+d); o.connect(g); g.connect(bgm.gain); o.start(t); o.stop(t+d+0.03); }
function bgmNz(t,d,vol,hp){ var a=actx,s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter(); s.buffer=bgm.nz; f.type='highpass'; f.frequency.value=hp; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+d); s.connect(f); f.connect(g); g.connect(bgm.gain); s.start(t); s.stop(t+d+0.02); }
function bgmKick(t){ var a=actx,o=a.createOscillator(),g=a.createGain(); o.frequency.setValueAtTime(170,t); o.frequency.exponentialRampToValueAtTime(48,t+0.13); g.gain.setValueAtTime(0.32,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16); o.connect(g); g.connect(bgm.gain); o.start(t); o.stop(t+0.18); }
function bgmTick(){
  if(muted||bgm.off||!actx||document.hidden){ bgm.next=0; return; }
  try{
    var a=actx; if(a.state==='suspended')a.resume();
    if(!bgm.gain){ bgm.gain=a.createGain(); bgm.gain.gain.value=0.55; bgm.gain.connect(a.destination); var n=(a.sampleRate*0.3)|0, b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0); for(var i=0;i<n;i++)d[i]=Math.random()*2-1; bgm.nz=b; }
    var want=bgmWant(); if(want!==bgm.name){ bgm.name=want; bgm.step=0; bgm.next=0; }
    var sg=SONGS[bgm.name]; if(!sg)return;
    var sl=60/sg.bpm/4, now=a.currentTime; if(bgm.next<now)bgm.next=now+0.06;
    while(bgm.next<now+0.3){ var st=bgm.step, bar=(st>>4)%sg.ch.length, q=st&15, c=sg.ch[bar], root=c[0], third=root+(c[1]?3:4), t=bgm.next, m=sg.mel[st%sg.mel.length];
      if(m){ var len=1; while(len<6&&!sg.mel[(st+len)%sg.mel.length])len++; bgmOsc(m,t,sl*len*0.95,sg.lead,sg.lv); }
      if(q%2===0)bgmOsc(root+12+((q===6||q===14)?12:0),t,sl*1.8,'triangle',0.16);
      if(sg.arp)bgmOsc([root,third,root+7,third][q%4]+24,t,sl*0.9,'square',sg.arp);
      if(sg.dr){ if(q%8===0||(sg.dr>1&&q===10))bgmKick(t); if(q%8===4)bgmNz(t,0.12,0.16,1500); if(q%2===0)bgmNz(t,0.03,sg.dr>1?0.06:0.035,7000); }
      bgm.step=(st+1)%(sg.ch.length*16); bgm.next+=sl; }
  }catch(e){}
}

function chAt(map,x,y){var c=Math.floor(x/S),r=Math.floor(y/S); if(c<0||c>=COLS||r<0||r>=ROWS)return '#'; return map[r].charAt(c);}

function loadLevel(i){
  lv=i; L=LEVELS[i];

  var playSeed=(Math.random()*1e9)|0;
  if(Math.random()<0.5){ L=Object.assign({},L); L.map=L.map.map(function(row){return row.split('').reverse().join('');}); }

  TH=THEMES[L.th===undefined?1:L.th]; buildSprites();

  goldGot=0; goldTotal=0; moves=9999; quiet=0; winSecs=0; owlHit=0; frameNo=0; endTimer=0; reason='';
  var map=L.map, r,c,ch;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    ch=map[r].charAt(c); var t=0;
    if(ch==='#')t=1; else if(ch>='a'&&ch<='d')t=8; else if(ch==='S')t=6; else if(ch==='W')t=7;
    tiles[r*COLS+c]=t; voff[r*COLS+c]=0; shake[r*COLS+c]=0; sox[r*COLS+c]=0; soy[r*COLS+c]=0;
  }
  /* 色は決まった乱数でならべる。最初から3つそろっていない・動かせる手がある配置にする */
  var ph=[], nc=L.colors||3, tryNo=0, kk;
  for(kk=0;kk<COLS*ROWS;kk++) if(tiles[kk]===8)ph.push(kk);
  do{
    var rc=rng32((4321+i*31+tryNo*7+playSeed)|0);
    for(var pi=0;pi<ph.length;pi++){ kk=ph[pi]; c=kk%COLS; r=(kk/COLS)|0; var pick, guard=0;
      do{ pick=2+Math.floor(rc()*nc); guard++; }
      while(guard<20&&((c>=2&&tiles[kk-1]===pick&&tiles[kk-2]===pick)||(r>=2&&tiles[kk-COLS]===pick&&tiles[kk-2*COLS]===pick)));
      tiles[kk]=pick;
    }
  }while(findMoves().length<3&&++tryNo<40);
  sel=-1; down=null; swapAnim=0; chain=0; setHammer(false);
  exits=[]; for(c=0;c<COLS;c++) if(tiles[(ROWS-1)*COLS+c]!==1) exits.push(c);
  var rnd=rng32((1234+i*97+playSeed)|0), row=0, x,y, ok='omG.M';
  for(y=6;y<H;y+=10.4,row++){
    for(x=6+(row%2?5.8:0);x<W-5;x+=11.6){
      ch=chAt(map,x,y); if(ch!=='o'&&ch!=='m'&&ch!=='G')continue;
      if(ok.indexOf(chAt(map,x-5.8,y-5.8))<0||ok.indexOf(chAt(map,x+5.8,y-5.8))<0||ok.indexOf(chAt(map,x-5.8,y+5.8))<0||ok.indexOf(chAt(map,x+5.8,y+5.8))<0)continue;
      if(n>=MAXP-2)break;
      var ratio=ch==='o'?0:(ch==='m'?0.22:0.6);
      px[n]=ox[n]=x+(rnd()-0.5)*0.5; py[n]=oy[n]=y; pr[n]=4.3+rnd()*1.3; ang[n]=rnd()*6.28;
      kind[n]=rnd()<ratio?1:0; spr[n]=Math.floor(rnd()*5); alive[n]=1; if(kind[n])goldTotal++; n++;
    }
  }
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++) if(map[r].charAt(c)==='M'){
    mole=n; px[n]=ox[n]=c*S+S/2; py[n]=oy[n]=r*S+S-13.5; pr[n]=13; kind[n]=2; alive[n]=1; ang[n]=0; n++;
  }
  goldNeed=L.gold?Math.max(1,Math.floor(goldTotal*L.gold)):0;
  gasOn=mole>=0; gasY=-110; owlX=W/2;
  settling=true; for(var k=0;k<100;k++) frame(); settling=false;
  if(mole>=0){ owlStart=py[mole]-18-(L.lead||15)*L.owl; gasY=owlStart; owlX=px[mole]; }
  fx.length=0; quiet=0; frameNo=0; idle=0; moleStill=false; moleStuck=false;

}

/* ---------- 物理 ---------- */
function solid(c,r){ if(c<0||c>=COLS)return true; if(r<0||r>=ROWS)return false; return tiles[r*COLS+c]!==0; }

function tileCollide(i){
  var x=px[i], y=py[i], r=pr[i];
  if(x<r){x=r;contact[i]=1;} else if(x>W-r){x=W-r;contact[i]=1;}
  if(y<r-40){y=r-40;}
  var c0=Math.floor((x-r)/S), c1=Math.floor((x+r)/S), r0=Math.floor((y-r)/S), r1=Math.floor((y+r)/S), c,rr;
  for(rr=r0;rr<=r1;rr++){ if(rr<0||rr>=ROWS)continue;
    for(c=c0;c<=c1;c++){ if(c<0||c>=COLS)continue; if(tiles[rr*COLS+c]===0)continue;
      var x0=c*S, y0=rr*S, cx=x<x0?x0:(x>x0+S?x0+S:x), cy=y<y0?y0:(y>y0+S?y0+S:y);
      var dx=x-cx, dy=y-cy, d2=dx*dx+dy*dy;
      if(d2>=r*r)continue;
      if(d2>1e-6){
        var d=Math.sqrt(d2), p=(r-d)/d; x+=dx*p; y+=dy*p; contact[i]=1;
        if(i===mole&&dy<0&&-dy>Math.abs(dx)*0.7)moleGround=true;
      }else{
        /* 中心がブロックの中：いちばん近い空いた面へ押し出す。出口がなければ岩はくだける */
        var best=1e9, bx=x, by=y, dd;
        if(!solid(c,rr-1)){dd=y-y0; if(dd<best){best=dd;bx=x;by=y0-r;}}
        if(!solid(c-1,rr)){dd=x-x0; if(dd<best){best=dd;bx=x0-r;by=y;}}
        if(!solid(c+1,rr)){dd=x0+S-x; if(dd<best){best=dd;bx=x0+S+r;by=y;}}
        if(!solid(c,rr+1)){dd=y0+S-y; if(dd<best){best=dd;bx=x;by=y0+S+r;}}
        if(best<1e9){x=bx;y=by;contact[i]=1;}
        else if(i===mole){y=y0-r;}
        else{alive[i]=0; if(kind[i]===1){goldTotal--;} px[i]=x;py[i]=y; return;}
      }
    }
  }
  px[i]=x; py[i]=y;
}

function substep(){

  }

    if(moleGround){
      var hv=(px[mole]-ox[mole])*0.7; px[mole]=ox[mole]+hv;
      if(moleDir!==0&&!settling&&status==='playing'){px[mole]+=moleDir*0.45; ox[mole]+=moleDir*0.45; moleFace=moleDir;}
    }

    if(hx<0)hx=0; else if(hx>=HW)hx=HW-1; if(hy<0)hy=0; else if(hy>=HH)hy=HH-1;
    hcell[i]=hy*HW+hx; hs[hcell[i]]++;

  for(i=n-1;i>=0;i--){ if(hcell[i]<0)continue; hi[--hs[hcell[i]]]=i; }

  for(var it=0;it<3;it++){
    for(i=0;i<n;i++){ var h=hcell[i]; if(h<0)continue;
      var cx=h%HW, cy=(h/HW)|0, yy,xx;
      for(yy=cy-1;yy<=cy+1;yy++){ if(yy<0||yy>=HH)continue;

    }else{

      else active++;

    }
    if(py[i]>H+10){

      if(i===mole){rescued=true;}
      else if(kind[i]===1&&!settling){goldGot++; sGold(); if(fx.length<80)fx.push({t:2,x:px[i],y:H+STRIP/2,l:18});}

var hsEnd=0, mlx=0, mly=0, moleStill=false, idle=0, msx=0, msy=0, moleStuck=false;

function blocksFall(){

  for(k=0;k<COLS*ROWS;k++){cnt[k]=0;moleBlk[k]=0;}
  hsEnd=0; for(i=0;i<n;i++){ if(!alive[i])continue; if(i!==mole)hsEnd++;
    c=Math.floor(px[i]/S); r=Math.floor(py[i]/S); if(c<0||c>=COLS||r<0||r>=ROWS)continue;
    if(i===mole){
      for(var rr=Math.floor((py[i]-13)/S);rr<=Math.floor((py[i]+13)/S);rr++)for(var cc=Math.floor((px[i]-13)/S);cc<=Math.floor((px[i]+13)/S);cc++)
        if(cc>=0&&cc<COLS&&rr>=0&&rr<ROWS)moleBlk[rr*COLS+cc]=1;
    }else cnt[r*COLS+c]++;

  falling=false;
  for(r=ROWS-2;r>=0;r--)for(c=0;c<COLS;c++){
    k=r*COLS+c; var t=tiles[k]; if(t<2)continue; var b=k+COLS;
    if(tiles[b]===0&&cnt[b]<=fallThr&&!moleBlk[b]&&voff[k]>-S*0.5){

/* モグさんの歩く向き：出口までの道すじをさがす */
var qc=new Int16Array(MAXC), qf=new Int8Array(MAXC), seen=new Uint8Array(MAXC);
function bfs(sc,sr,soft){
  var k,head=0,tail=0,c,r,f,b,d,nk;
  for(k=0;k<COLS*ROWS;k++)seen[k]=0;
  qc[tail]=sr*COLS+sc; qf[tail]=2; tail++; seen[sr*COLS+sc]=1;
  while(head<tail){
    k=qc[head]; f=qf[head]; head++; c=k%COLS; r=(k/COLS)|0;
    if(r===ROWS-1) return f===2?0:f;
    b=k+COLS;
    if(!seen[b]&&(soft?tiles[b]!==1:tiles[b]===0)){seen[b]=1;qc[tail]=b;qf[tail]=f===2?0:f;tail++;}
    if(tiles[b]!==0||cnt[b]>=restThr){
      for(d=-1;d<=1;d+=2){ if(c+d<0||c+d>=COLS)continue; nk=k+d;
        if(!seen[nk]&&(soft?tiles[nk]!==1:tiles[nk]===0)){seen[nk]=1;qc[tail]=nk;qf[tail]=f===2?d:f;tail++;}
      }
    }
  }

}
function moleAI(){
  if(mole<0||!alive[mole])return;
  var mc=Math.max(0,Math.min(COLS-1,Math.floor(px[mole]/S))), mr=Math.max(0,Math.min(ROWS-1,Math.floor(py[mole]/S)));
  var d=bfs(mc,mr,false); if(d===null)d=bfs(mc,mr,true);
  wantDown=(d===0);
  if(d===null||d===0){var dx=(mc+0.5)*S-px[mole]; d=Math.abs(dx)>3?(dx>0?1:-1):0;}
  moleDir=d;
}

function isCol(t){return t>=2&&t<=5;}
/* k を通る「たて・よこ3つ以上」のならびを out にしるす */
function runAt(k,out){
  var t=tiles[k]; if(!isCol(t))return false; var c=k%COLS, r=(k/COLS)|0, a=c, b=c, i, hit=false;
  while(a>0&&tiles[r*COLS+a-1]===t)a--; while(b<COLS-1&&tiles[r*COLS+b+1]===t)b++;
  if(b-a>=2){hit=true; if(out)for(i=a;i<=b;i++)out[r*COLS+i]=1;}
  a=r; b=r; while(a>0&&tiles[(a-1)*COLS+c]===t)a--; while(b<ROWS-1&&tiles[(b+1)*COLS+c]===t)b++;
  if(b-a>=2){hit=true; if(out)for(i=a;i<=b;i++)out[i*COLS+c]=1;}
  return hit;
}
function allMatches(){ var o={},k,res=[]; for(k=0;k<COLS*ROWS;k++) if(isCol(tiles[k]))runAt(k,o); for(k in o)res.push(+k); return res; }
/* そろった所をさがす。4つでバクダン、5つ以上・L字T字で大バクダンができる */
var owlStart=-110, wantDown=false, noMove=0, lastSwap=[], shakeAmt=0, owlX=180, owlHit=0, winSecs=0;
function secsLeft(){ return (mole>=0&&alive[mole]&&L)?Math.max(0,(py[mole]-18-gasY)/L.owl):99; }
function matchScan(){
  var o={},cells=[],bombs=[],bk={},r,c,k,t,len,i,pos;
  function addBomb(k,ty){ if(bk[k]===undefined){bk[k]=bombs.length;bombs.push([k,ty]);} else if(ty>bombs[bk[k]][1])bombs[bk[k]][1]=ty; }
  for(r=0;r<ROWS;r++){ c=0; while(c<COLS){ t=tiles[r*COLS+c]; len=1;
    if(isCol(t)){ while(c+len<COLS&&tiles[r*COLS+c+len]===t)len++;
      if(len>=3){ pos=r*COLS+c+((len/2)|0); for(i=0;i<len;i++){k=r*COLS+c+i; o[k]=(o[k]||0)+1; if(lastSwap.indexOf(k)>=0)pos=k;} if(len>=4)addBomb(pos,len>=5?10:9); } }
    c+=len; } }
  for(c=0;c<COLS;c++){ r=0; while(r<ROWS){ t=tiles[r*COLS+c]; len=1;
    if(isCol(t)){ while(r+len<ROWS&&tiles[(r+len)*COLS+c]===t)len++;
      if(len>=3){ pos=(r+len-1)*COLS+c; for(i=0;i<len;i++){k=(r+i)*COLS+c; o[k]=(o[k]||0)+1; if(lastSwap.indexOf(k)>=0)pos=k; if(o[k]>=2)addBomb(k,10);} if(len>=4)addBomb(pos,len>=5?10:9); } }
    r+=len; } }
  for(k in o)cells.push(+k);

}
/* 動かせる所がなくなったら、色をまぜなおす */
function shuffle(){
  var cells=[],cols=[],k,i,j,t,tryNo=0;
  for(k=0;k<COLS*ROWS;k++) if(isCol(tiles[k])){cells.push(k);cols.push(tiles[k]);}
  if(!cells.length)return;
  if(cells.length>=3){
    do{ for(i=cols.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=cols[i];cols[i]=cols[j];cols[j]=t;} for(i=0;i<cells.length;i++)tiles[cells[i]]=cols[i]; }
    while(!findMoves().length&&!matchScan().cells.length&&++tryNo<60);
  }
  if(!findMoves().length&&!matchScan().cells.length) tiles[cells[Math.floor(Math.random()*cells.length)]]=9;
  if(!settling)fx.push({t:4,x:W/2,y:H/2,l:55,s:'まぜなおし！'});
}
function anyBomb(){ for(var k=0;k<COLS*ROWS;k++) if(tiles[k]>=9)return true; return false; }
/* バクダン：まわりのブロック・石・木ばこをまとめてこわし、岩をふきとばす */
function explode(k){
  var ty=tiles[k]; if(ty<9)return; var R=ty===10?2:1, c0=k%COLS, r0=(k/COLS)|0, c,r,q,list=[],more=[],i;
  burst(c0,r0,COLORS[ty]); tiles[k]=0;
  for(r=r0-R;r<=r0+R;r++)for(c=c0-R;c<=c0+R;c++){ if(c<0||c>=COLS||r<0||r>=ROWS)continue; q=r*COLS+c;
    if(tiles[q]>=9)more.push(q); else if(tiles[q]>=2)list.push(q); }

  for(i=0;i<n;i++){ if(!alive[i]||i===mole)continue; var dx=px[i]-cx, dy=py[i]-cy, d2=dx*dx+dy*dy; if(d2>rad*rad||d2<1)continue;
    var dd=Math.sqrt(d2), v=3.2*(1-dd/rad); ox[i]=px[i]-dx/dd*v; oy[i]=py[i]-dy/dd*v+v*0.5; }
  if(!settling){ gasY=Math.max(owlStart,gasY-(R===2?30:15)); owlHit=30; shakeAmt=Math.max(shakeAmt,R===2?13:8); fx.push({t:3,x:cx,y:cy,l:20,s:R===2?6:4}); tone(R===2?70:95,0.4,'sawtooth',0.22,35); }

function tapBomb(k){
  if(status!=='playing'||moves<=0||k<0||tiles[k]<9)return false;
  idle=0; chain=0; lastSwap.length=0; explode(k); updateHud(); return true;
}
function swapOk(a,b){
  if(!isCol(tiles[a])||!isCol(tiles[b])||tiles[a]===tiles[b])return false;
  var t=tiles[a]; tiles[a]=tiles[b]; tiles[b]=t; var ok=runAt(a,null)||runAt(b,null); t=tiles[a]; tiles[a]=tiles[b]; tiles[b]=t; return ok;
}
function findMoves(){ var res=[],k,c; for(k=0;k<COLS*ROWS;k++){ c=k%COLS; if(c<COLS-1&&swapOk(k,k+1))res.push([k,k+1]); if(k+COLS<COLS*ROWS&&swapOk(k,k+COLS))res.push([k,k+COLS]); } return res; }
function anySingle(){ for(var k=0;k<COLS*ROWS;k++) if(isCol(tiles[k]))return true; return false; }
var COLORS=['','', '#e07a2f','#1f9e97','#7d5bd0','#9ab82f','#8a8a8a','#a8743c','','#4a4a50','#d8452e'];
function removeCells(g){
  var i,q,j,extra=[];
  for(i=0;i<g.length;i++){ q=g[i]; var cc=q%COLS, rr=(q/COLS)|0;
    var nb=[cc>0?q-1:-1,cc<COLS-1?q+1:-1,rr>0?q-COLS:-1,rr<ROWS-1?q+COLS:-1];
    for(j=0;j<4;j++) if(nb[j]>=0&&tiles[nb[j]]===7&&extra.indexOf(nb[j])<0)extra.push(nb[j]);
  }
  g=g.concat(extra);
  for(i=0;i<g.length;i++){ q=g[i]; burst(q%COLS,(q/COLS)|0,COLORS[tiles[q]]); tiles[q]=0; voff[q]=0; sox[q]=0; soy[q]=0; }
}
function adjacent(a,b){ var d=Math.abs(a-b); return d===COLS||(d===1&&((a/COLS)|0)===((b/COLS)|0)); }

function trySwap(a,b){

    }

}

function $(id){return document.getElementById(id);}
function setHammer(on){ hammer=on; var b=$('btnHam'); if(b)b.className=on?'main':''; }
function updateHud(){
  if(!L)return;
  $('stName').textContent=L.name; $('stNo').textContent='ステージ '+(lv+1)+' / '+LEVELS.length;
  var sc=Math.ceil(secsLeft()), m=$('mv'); m.textContent=(mole>=0&&alive[mole])?Math.min(sc,99):'-'; m.className=sc<=5?'low':'';
  var gg=$('gGold'), gm=$('gMole');
  gg.hidden=false; gg.innerHTML='<i>●</i> 金 '+goldGot+' こ'; gg.className='';
  if(mole>=0){gm.hidden=false; gm.textContent=rescued?'モグさん 脱出！':'モグさんを出口へ'; gm.className=rescued?'done':'';} else gm.hidden=true;
  $('goalLine').textContent=L.goal;
}
function finish(w){
  var st=0;
  if(w){ var fr=winSecs/Math.max(1,(H-8-owlStart)/L.owl); st=fr>=0.7?3:(fr>=0.45?2:1); if((save.stars[lv]|0)<st)save.stars[lv]=st; store(); sWin(); }
  else sFail();
  $('endTitle').textContent=w?'クリア！':'ざんねん…';
  $('endTitle').style.color=w?'var(--gold)':'var(--ng)';
  $('endStars').textContent=w?('★★★'.slice(0,st)+'☆☆☆'.slice(0,3-st)):'';
  $('endStars').hidden=!w;
  var msg;
  if(w) msg='フクロウに '+Math.round(winSecs)+' 秒の差をつけて脱出！ 金 '+goldGot+' こ。'+(lv===LEVELS.length-1?'全ステージ制覇です！':'');
  else if(reason==='gas') msg='モグさんが フクロウに つかまってしまいました。';
  else if(reason==='stuck') msg='消せるブロックが なくなりました。';
  else msg='手数が なくなりました。';
  $('endMsg').textContent=msg;
  $('btnNext').hidden=!(w&&lv<LEVELS.length-1);
  $('btnAgain').className=(w&&lv<LEVELS.length-1)?'':'main';
  $('ovEnd').hidden=false;
}
function buildMenu(){
  var g=$('grid'); g.innerHTML='';
  LEVELS.forEach(function(l,i){
    var b=document.createElement('button'), s=save.stars[i]|0, open=unlocked(i);
    b.disabled=!open;
    b.innerHTML='<span class="n">ステージ '+(i+1)+(open?'':'　🔒')+'</span><span class="t">'+l.name+'</span><span class="s">'+(s?'★★★'.slice(0,s)+'☆☆☆'.slice(0,3-s):(open?'☆☆☆':'　'))+'</span>';
    b.onclick=function(){start(i);};
    g.appendChild(b);
  });
}
function buildThemes(){
  var box=$('themes'); box.innerHTML='';
  THEMES.forEach(function(t,i){
    var b=document.createElement('button'); b.textContent=t.name; if(i===thIdx)b.className='main';
    b.onclick=function(){ thIdx=i; TH=THEMES[i]; try{localStorage.setItem(KEY+'_theme',String(i));}catch(e){} buildSprites(); drawBg(); buildThemes(); };
    box.appendChild(b);
  });
}
function showMenu(){status='menu'; buildMenu(); $('ovEnd').hidden=true; $('ovHow').hidden=true; $('ovMenu').hidden=false;}
function start(i){
  $('ovMenu').hidden=true; $('ovEnd').hidden=true; $('ovHow').hidden=true;
  loadLevel(i);
  if(i===0&&!save.how){ $('ovHow').hidden=false; status='paused'; }
}
$('btnMenu').onclick=showMenu; $('btnToMenu').onclick=showMenu;
$('btnRetry').onclick=function(){ if(L&&status!=='menu')start(lv); };
$('btnAgain').onclick=function(){start(lv);};
$('btnNext').onclick=function(){start(Math.min(lv+1,LEVELS.length-1));};
var howBack='';
$('btnHow').onclick=function(){ if(!$('ovHow').hidden)return; howBack=status; if(status==='playing')status='paused'; $('ovHow').hidden=false; };
$('btnHowOk').onclick=function(){ $('ovHow').hidden=true; save.how=true; store(); if(status==='paused')status='playing'; };
/* 音のボタン：消音 → 効果音＋音楽 → 効果音だけ → 消音 … */
var sndMode=0; $('btnSnd').onclick=function(){ sndMode=(sndMode+1)%3; muted=sndMode===0; bgm.off=sndMode!==1; this.textContent=['🔇','🎵','🔊'][sndMode]; if(!muted)tone(880,0.1,'sine',0.1); bgm.next=0; };

function cellAt(e){
  var b=cv.getBoundingClientRect(), x=(e.clientX-b.left)/b.width*W, y=(e.clientY-b.top)/b.height*CH, c=Math.floor(x/S), r=Math.floor(y/S);
  return {x:x,y:y,k:(c<0||c>=COLS||r<0||r>=ROWS)?-1:r*COLS+c};
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  var p=cellAt(e); if(p.k<0||status!=='playing')return;
  if(hammer){ if(!hammerAt(p.k)){ if(tiles[p.k]>=2)shake[p.k]=14; sNo(); } setHammer(false); sel=-1; return; }
  if(tiles[p.k]>=9){ tapBomb(p.k); sel=-1; down=null; return; }
  if(sel>=0&&sel!==p.k&&adjacent(sel,p.k)&&tiles[p.k]>=2){ trySwap(sel,p.k); sel=-1; down=null; return; }
  if(isCol(tiles[p.k])){ down={k:p.k,x:p.x,y:p.y}; sel=p.k; try{cv.setPointerCapture(e.pointerId);}catch(err){} } else { sel=-1; down=null; }
});
cv.addEventListener('pointermove',function(e){
  if(!down)return;
  var p=cellAt(e), dx=p.x-down.x, dy=p.y-down.y, k=down.k, c=k%COLS, k2=-1;
  if(Math.max(Math.abs(dx),Math.abs(dy))<13)return;
  if(Math.abs(dx)>Math.abs(dy)){ if(dx>0&&c<COLS-1)k2=k+1; else if(dx<0&&c>0)k2=k-1; } else { k2=dy>0?k+COLS:k-COLS; }
  down=null; sel=-1;
  if(k2>=0&&k2<COLS*ROWS)trySwap(k,k2);
});
cv.addEventListener('pointerup',function(){down=null;});
cv.addEventListener('pointercancel',function(){down=null;});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

function resize(){
  var box=$('stage'), w=box.clientWidth, h=box.clientHeight; if(w<50||h<50)return;
  var s=Math.min((w-4)/W,(h-4)/CH), cw=Math.floor(W*s), chh=Math.floor(CH*s);
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=cw+'px'; cv.style.height=chh+'px';
  cv.width=Math.round(cw*dpr); cv.height=Math.round(chh*dpr); K=cv.width/W;
  buildSprites(); drawBg();
}
window.addEventListener('resize',resize);

var last=0, acc=0;
function loop(ts){
  requestAnimationFrame(loop);
  var dt=Math.min(0.1,(ts-last)/1000||0); last=ts;
  if(status==='menu'||status==='paused'||!L){ if(L)render(); return; }
  acc+=dt; var steps=0;
  while(acc>=1/60&&steps<3){frame();acc-=1/60;steps++;}
  if(acc>0.05)acc=0;
  render();
}

/* 調整・点検用 */
window.__iwa={
  load:function(i){$('ovMenu').hidden=true;$('ovEnd').hidden=true;$('ovHow').hidden=true;loadLevel(i);},
  step:function(k){for(var i=0;i<k;i++)frame();},
  swap:trySwap, hammer:hammerAt, moves:findMoves, bomb:tapBomb, put:function(k,t){tiles[k]=t;},
  dump:function(){var s='',r,c;for(r=0;r<ROWS;r++){for(c=0;c<COLS;c++){var t=tiles[r*COLS+c];s+=t===0?(cnt[r*COLS+c]>=5?':':'.'):'#abcdSW'.charAt(t-1);}s+='\n';}return s+JSON.stringify({active:active,falling:falling,dir:moleDir,still:moleStill,ground:moleGround});},
  info:function(){return {status:status,reason:reason,moves:moves,gold:goldGot,need:goldNeed,total:goldTotal,n:hsEnd,mole:mole>=0?[Math.round(px[mole]),Math.round(py[mole])]:null,rescued:rescued,gasY:Math.round(gasY),quiet:quiet};},
  run:function(list,tries,think,free){
    var self=this, res=window.__res={done:false,rows:[]}, li=0;
    (function next(){
      if(li>=list.length){res.done=true;return;}
      var i=list[li], used=[], t=0;
      (function one(){
        if(t>=tries){res.rows.push('S'+(i+1)+' margin['+used.join(',')+']'); li++; setTimeout(next,0); return;}
        var r=self.bot(i,1,think,free); if(r.wins)used.push(free?Math.round(frameNo/60):Math.round(winSecs)); else used.push('x'+Math.round(frameNo/60)); t++; setTimeout(one,0);
      })();
    })();
  },
  bot:function(i,tries,think,free){
    var wins=0,left=0,fin=finish; finish=function(){};
    for(var t=0;t<tries;t++){
      loadLevel(i); if(free)L=Object.assign({},L,{owl:0.01}); var guard=0;
      while(status!=='end'&&guard++<400){
        if(status==='playing'){ var bl=[]; for(var bk2=0;bk2<COLS*ROWS;bk2++) if(tiles[bk2]>=9)bl.push(bk2); var ms=findMoves();
          if(bl.length&&(Math.random()<0.5||!ms.length)){tapBomb(bl[0]);} else if(ms.length){var m=ms[Math.floor(Math.random()*ms.length)]; trySwap(m[0],m[1]);} }
        for(var w=0;w<(think||20);w++)frame();
      }
      if(won()){wins++;}
    }
    finish=fin; return {wins:wins,tries:tries,avgLeft:wins?left/wins:0};
  }
};

resize(); buildMenu();
requestAnimationFrame(function(ts){last=ts;resize();loop(ts);});
})();
