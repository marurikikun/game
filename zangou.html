<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>塹壕突破</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ゲーム"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#14120c"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}body{margin:0;font-size:14px}[hidden]{display:none!important}</style></head><body><title>塹壕突破</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{color-scheme:dark;--fg:#f2ecdc;--dim:#b9b09a;--acc:#ffc94a;--bad:#ff5a4a;--good:#8cf06a;--panel:rgba(24,22,16,.86);--line:#6a6048}
html,body{height:100%}
body{background:#14120c;color:var(--fg);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;overflow:hidden;overscroll-behavior:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#14120c;
  --sl:max(12px,env(safe-area-inset-left,0px));--sr:max(12px,env(safe-area-inset-right,0px));--st:max(8px,env(safe-area-inset-top,0px));--sb:max(10px,env(safe-area-inset-bottom,0px))}
#stage.rot{--sl:max(12px,env(safe-area-inset-top,0px));--sr:max(12px,env(safe-area-inset-bottom,0px));--st:8px;--sb:10px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;pointer-events:none;z-index:2}
#hpBox{left:var(--sl);top:var(--st);width:34%;max-width:230px}
#hpBar{height:14px;border:1px solid var(--line);border-radius:7px;background:rgba(0,0,0,.5);overflow:hidden}
#hpFill{height:100%;width:100%;background:var(--good);transition:width .15s}
#hpTxt{font-size:12px;color:var(--fg);text-shadow:0 1px 2px #000;margin-top:2px}
#info{left:0;right:0;top:var(--st);text-align:center;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000}
#ammo{right:calc(var(--sr) + 96px);top:var(--st);font-size:20px;font-weight:900;text-shadow:0 1px 3px #000;text-align:right}
#ammo small{display:block;font-size:11px;font-weight:400;color:var(--dim)}
#cross{left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 3px #000}
#cross:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff;border-radius:50%}
#cross.hit{border-color:var(--acc);transform:scale(1.25)}
#cross.low{opacity:.25}
#warn{left:0;right:0;top:24%;text-align:center;font-size:26px;font-weight:900;color:var(--bad);text-shadow:0 2px 6px #000;opacity:0}
#warn.on{opacity:1}
#msg{left:0;right:0;top:38%;text-align:center;font-size:22px;font-weight:900;color:var(--acc);text-shadow:0 2px 6px #000;opacity:0;transition:opacity .25s}
#msg.on{opacity:1}
#hurt{inset:0;background:radial-gradient(ellipse at center,rgba(255,40,20,0) 45%,rgba(255,40,20,.75) 100%);opacity:0;transition:opacity .3s}
#duckShade{inset:0;background:rgba(10,8,4,.35);opacity:0;transition:opacity .12s}
button{font:inherit;color:var(--fg);background:#2c271b;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.4;cursor:pointer;touch-action:manipulation}
.pad{position:absolute;z-index:3;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(30,26,18,.55);color:#fff;font-weight:900;touch-action:none;padding:0}
#bFire{right:var(--sr);bottom:calc(var(--sb) + 8px);width:98px;height:98px;font-size:20px;background:rgba(200,60,30,.55)}
#bDuck{right:calc(var(--sr) + 112px);bottom:var(--sb);width:80px;height:80px;font-size:15px}
.pad.on{background:rgba(255,200,70,.75);color:#2a1c05}
.top{position:absolute;z-index:3;top:var(--st);padding:4px 9px;font-size:13px;border-radius:9px;background:rgba(30,26,18,.7)}
#bSnd{right:var(--sr)} #bMenu{right:calc(var(--sr) + 42px)}
.ov{position:absolute;inset:0;z-index:6;background:rgba(14,12,8,.95);overflow:auto;padding:12px max(16px,var(--sr)) 14px max(16px,var(--sl))}
.in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
h1{font-size:24px;margin:0;color:var(--acc);letter-spacing:.08em;text-align:center}
h2{font-size:22px;margin:0;text-align:center}
.sub{margin:0;font-size:13px;color:var(--dim);text-align:center;line-height:1.6}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px}
.cols button{text-align:left;padding:7px 10px}
.cols .n{display:block;font-size:11px;color:var(--dim)} .cols .t{display:block;font-weight:700} .cols .s{display:block;color:var(--acc);letter-spacing:.1em;font-size:13px}
.cols button.sel{border-color:var(--acc);background:#4a3c14}
.lab{font-size:13px;color:var(--acc);font-weight:700;margin-top:2px}
.how{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:13.5px;line-height:1.75}
.how b{color:var(--acc)}
button.main{background:var(--acc);color:#2a1c05;border-color:#ffe6a3;font-weight:900;text-align:center;font-size:17px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.big{font-size:34px;font-weight:900;text-align:center;color:var(--acc);letter-spacing:.1em}
</style>

<div id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="duckShade"></div>
  <div class="hud" id="hurt"></div>
  <div class="hud" id="hpBox"><div id="hpBar"><div id="hpFill"></div></div><div id="hpTxt">体力 100</div></div>
  <div class="hud" id="info"></div>
  <div class="hud" id="ammo">8<small>小銃</small></div>
  <div class="hud" id="cross"></div>
  <div class="hud" id="warn">かくれろ！</div>
  <div class="hud" id="msg"></div>
  <button class="top" id="bSnd" aria-label="音の入・切">🔇</button>
  <button class="top" id="bMenu">中断</button>
  <button class="pad" id="bDuck">かくれる</button>
  <button class="pad" id="bFire">撃つ</button>
  <div class="ov" id="ovMenu"><div class="in">
    <h1>塹壕突破</h1>
    <p class="sub">物かげから身を出して撃ち、敵の陣地をひとつずつ突破する。スマホは横に持って遊びます。</p>
    <div class="lab">武器をえらぶ</div>
    <div class="cols" id="wGrid"></div>
    <div class="lab">ステージをえらぶ</div>
    <div class="cols" id="sGrid"></div>
    <div class="how"><b>画面をなぞる</b>と、ねらいが動きます（「撃つ」を押したままなぞっても動きます）。<br><b>「撃つ」</b>を押している間、撃ちつづけます。頭に当てると大きなダメージ。<br>敵の頭の上の<b>赤い輪</b>がちぢみきると撃ってきます。その前に<b>「かくれる」</b>を押すと当たりません。かくれている間は弾こめが速くなります。<br>走ってくる敵と、飛んでくる手りゅう弾は、<b>かくれても防げません</b>。撃って止めましょう。<br>全員たおすと、次の物かげへ自動で前進します。</div>
  </div></div>
  <div class="ov" id="ovEnd" hidden><div class="in">
    <h2 id="eTitle"></h2>
    <div class="big" id="eStar"></div>
    <p class="sub" id="eMsg"></p>
    <div class="row"><button class="main" id="bNext">つぎのステージへ</button><button id="bAgain">もう一度</button><button id="bBack">ステージをえらぶ</button></div>
  </div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
function $(i){return document.getElementById(i);}
var T=window.THREE, stage=$('stage'), W=800, H=400, rot=false;
function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}

/* ---------- 記録 ---------- */
var KEY='zangou_v1', save={star:[],wp:0,snd:0};
try{ var raw=localStorage.getItem(KEY); if(raw){ var o=JSON.parse(raw); if(o&&o.star){ save.star=o.star; save.wp=o.wp|0; save.snd=o.snd?1:0; } } }catch(e){}
function store(){ try{ localStorage.setItem(KEY,JSON.stringify(save)); }catch(e){} }

/* ---------- 武器・敵・ステージ ---------- */
var WPN=[
  {n:'小銃',d:'正確で一発が強い',dmg:50,rate:0.30,mag:8,rel:1.3,spr:0.004,pel:1,zoom:1.15},
  {n:'短機関銃',d:'連射がきく。弾が多い',dmg:19,rate:0.085,mag:32,rel:1.6,spr:0.02,pel:1,zoom:1.05},
  {n:'散弾銃',d:'近い敵に強い。広がる',dmg:18,rate:0.65,mag:6,rel:1.7,spr:0.028,pel:9,zoom:1.0,fall:1},
  {n:'狙撃銃',d:'遠くまで拡大。一発必中',dmg:150,rate:0.95,mag:5,rel:2.0,spr:0.0006,pel:1,zoom:2.1}
];
/* 敵の種類：0 歩兵　1 突撃兵（走ってくる）　2 機関銃手　3 擲弾兵　4 狙撃兵　6 大型（装甲車・戦車） */
var ET=[
  {n:'歩兵',hp:50,tele:1.35,dmg:10,col:0x8a3a2c},
  {n:'突撃兵',hp:40,dmg:14,col:0xc8641e},
  {n:'機関銃手',hp:120,tele:1.2,dmg:4,col:0x4a2420},
  {n:'擲弾兵',hp:50,tele:1.2,dmg:22,col:0x5a6a2a},
  {n:'狙撃兵',hp:40,tele:2.0,dmg:28,col:0x4a5a6a}
];
var STG=[
  {name:'夜明けの塹壕',pts:4,types:[0,0,0,1],boss:0,sky:0xd8c3a0,gnd:0x6b5a3e,cov:0xa89468},
  {name:'焼けた村',pts:4,types:[0,0,1,3],boss:0,sky:0xb9b4aa,gnd:0x5e5a52,cov:0x7a7468},
  {name:'霧の森',pts:5,types:[0,0,1,2,3],boss:1,sky:0xaab8a4,gnd:0x4a5a36,cov:0x6a5a3a},
  {name:'川の橋',pts:5,types:[0,0,1,2,4],boss:0,sky:0xe0a070,gnd:0x6a5a4a,cov:0x8a7a6a},
  {name:'砲台の丘',pts:5,types:[0,1,2,3,4],boss:0,sky:0x9ab0c8,gnd:0x5a6238,cov:0x9a8a60},
  {name:'敵司令部',pts:6,types:[0,1,2,3,4],boss:2,sky:0x2a3450,gnd:0x3a3c38,cov:0x5a5a5a}
];
var STEP=46, AS=1.3;   /* AS＝当たり判定のおまけ（指でねらいやすくする） */

/* ---------- 音 ---------- */
var actx=null, muted=!save.snd, nz=null, bgT=null, bgStep=0;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); var b=actx.createBuffer(1,actx.sampleRate,actx.sampleRate), d=b.getChannelData(0), i; for(i=0;i<d.length;i++)d[i]=Math.random()*2-1; nz=b; }catch(e){} } if(actx&&actx.state==='suspended')actx.resume(); return actx; }
function tone(f,d,type,vol,slide){ if(muted||auto||!ac())return; var t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.02); }
function noise(d,vol,freq,type){ if(muted||auto||!ac()||!nz)return; var t=actx.currentTime, s=actx.createBufferSource(), g=actx.createGain(), f=actx.createBiquadFilter(); s.buffer=nz; f.type=type||'lowpass'; f.frequency.value=freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+d); s.connect(f); f.connect(g); g.connect(actx.destination); s.start(t,Math.random()*0.5); s.stop(t+d+0.02); }
function sShot(){ var w=G.w; noise(w.pel>1?0.3:(w.dmg>100?0.4:0.14),w.dmg>100?0.5:0.3,w.pel>1?1400:2600); tone(w.dmg>100?90:150,0.1,'square',0.12,50); }
function sEnemy(){ noise(0.1,0.12,1800); }
function sBoom(){ noise(0.6,0.5,500); tone(70,0.5,'sine',0.3,30); }
function sHit(h){ tone(h?1500:900,0.06,'square',0.07); }
function sHurt(){ tone(160,0.25,'sawtooth',0.18,70); }
function sWin(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ tone(f,0.3,'triangle',0.14); },i*130); }); }
function bgm(){ if(muted||auto||!G||!G.on||!ac())return; var s=bgStep++%16, boss=G.boss&&!G.boss.dead;   /* 小太鼓の行進リズムと低い音 */
  if(s%4===0)tone(boss?55:65,0.22,'triangle',0.16,40); if(s%4===2||s===13||s===15||(boss&&s%2===1))noise(0.06,0.07,3200,'highpass'); if(s%8===4)noise(0.12,0.1,1600,'bandpass');
  if(s%8===0)tone([98,98,87,110][(bgStep>>3)%4]*(boss?1:1),0.5,'sawtooth',0.035); }
function setSnd(){ $('bSnd').textContent=muted?'🔇':'🔊'; clearInterval(bgT); bgT=null; if(!muted)bgT=setInterval(bgm,140); }
$('bSnd').onclick=function(){ muted=!muted; save.snd=muted?0:1; store(); setSnd(); if(!muted)tone(880,0.1,'sine',0.1); };

/* ---------- 画面の向き：縦持ちのときは、絵を90度回して横長にする ---------- */
var renderer=null, scene=null, cam=null, world=null, gun=null, flash=null;
function layout(){ var vw=window.innerWidth, vh=window.innerHeight; rot=vh>vw*1.05; W=rot?vh:vw; H=rot?vw:vh;
  stage.style.width=W+'px'; stage.style.height=H+'px'; stage.style.transform=rot?('translateX('+vw+'px) rotate(90deg)'):'none'; stage.className=rot?'rot':'';
  if(renderer){ renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1)); renderer.setSize(W,H,false); cam.aspect=W/H; cam.updateProjectionMatrix(); } }
window.addEventListener('resize',layout);

/* ---------- 3Dの準備 ---------- */
function box(w,h,d,col,x,y,z,par){ var m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshLambertMaterial({color:col})); m.position.set(x,y,z); (par||world).add(m); return m; }
function init3d(){ if(!T)return; renderer=new T.WebGLRenderer({canvas:$('cv'),antialias:true}); scene=new T.Scene(); cam=new T.PerspectiveCamera(56,2,0.1,400); scene.add(cam);
  scene.add(new T.HemisphereLight(0xffffff,0x554433,0.95)); var dl=new T.DirectionalLight(0xfff0d0,0.7); dl.position.set(30,60,20); scene.add(dl);
  world=new T.Group(); scene.add(world);
  gun=new T.Group(); cam.add(gun); box(0.07,0.09,0.75,0x2a2a2a,0,0,-0.2,gun); box(0.09,0.14,0.35,0x5a3a1e,0,-0.05,0.2,gun); box(0.05,0.18,0.07,0x2a2a2a,0,-0.14,0.02,gun);
  flash=new T.Mesh(new T.SphereGeometry(0.09,6,5),new T.MeshBasicMaterial({color:0xffe27a})); flash.position.set(0,0.01,-0.62); flash.visible=false; gun.add(flash); gun.position.set(0.24,-0.2,-0.5); gun.scale.setScalar(0.6); }
function buildStage(si){ var st=STG[si], p, i, slots=[];
  if(vis){ while(world.children.length){ var c=world.children.pop(); if(c.geometry)c.geometry.dispose(); }
    scene.background=new T.Color(st.sky); scene.fog=new T.Fog(st.sky,35,si===2?110:170);
    var g=new T.Mesh(new T.PlaneGeometry(500,700),new T.MeshLambertMaterial({color:st.gnd})); g.rotation.x=-Math.PI/2; g.position.z=-250; world.add(g);
    box(3.2,0.02,700,new T.Color(st.gnd).multiplyScalar(0.8).getHex(),0,0.01,-250);
    for(i=0;i<70;i++){ var tx=(Math.random()<0.5?-1:1)*rnd(17,70), tz=-rnd(-20,st.pts*STEP+90);
      if(si===1||si===5){ var hh=rnd(3,8); box(rnd(5,9),hh,rnd(5,9),si===5?0x3c3c44:0x6a6258,tx*1.2,hh/2,tz); if(Math.random()<0.5)box(1.2,1.2,0.3,si===5?0xffd27a:0x1a1814,tx*1.2+(tx>0?-3:3),hh*0.6,tz+2); }
      else { box(0.35,rnd(2,3.5),0.35,0x4a3a26,tx,1.2,tz); var cn=new T.Mesh(new T.ConeGeometry(rnd(1.4,2.4),rnd(4,7),7),new T.MeshLambertMaterial({color:si===3?0x5a5a2a:0x2e4a26})); cn.position.set(tx,4.5,tz); world.add(cn); } }
    for(i=0;i<8;i++){ var hl=new T.Mesh(new T.SphereGeometry(rnd(40,80),10,6),new T.MeshLambertMaterial({color:new T.Color(st.gnd).multiplyScalar(0.7).getHex()})); hl.scale.y=0.25; hl.position.set(rnd(-220,220),-4,-rnd(150,st.pts*STEP+260)); world.add(hl); } }
  for(p=0;p<st.pts;p++){ var pz=-p*STEP, arr=[];
    if(vis){ box(3.4,0.9,0.7,st.cov,0,0.45,pz-1.15); box(1.6,0.3,0.6,new T.Color(st.cov).multiplyScalar(0.85).getHex(),-0.6,1.0,pz-1.15); }
    for(i=0;i<6;i++){ var x=-13+i*5.2+rnd(-1.6,1.6); if(Math.abs(x)<2.6)x=x<0?-2.8:2.8; var d=rnd(9,25), z=pz-d; arr.push({x:x,z:z,by:0,far:0,used:0});
      if(vis){ box(2.1,1.15,0.6,st.cov,x,0.575,z+0.7); if(i%2)box(0.7,0.5,0.6,new T.Color(st.cov).multiplyScalar(0.8).getHex(),x+0.5,1.4,z+0.7); } }
    for(i=0;i<2;i++){ var fx=(i?1:-1)*rnd(9,20), fz=pz-rnd(33,41); arr.push({x:fx,z:fz,by:3.6,far:1,used:0});
      if(vis){ box(2.6,3.6,2.6,new T.Color(st.cov).multiplyScalar(0.7).getHex(),fx,1.8,fz); box(2.6,1.1,0.4,st.cov,fx,4.15,fz+1.1); } }
    slots.push(arr); }
  return slots; }

/* ---------- ゲームの状態 ---------- */
var G=null, si=0, auto=false, vis=false, fxs=[], msgT=null;
function start(i){ si=i; vis=!!T&&!auto; layout(); var st=STG[i];
  G={on:true,st:st,w:WPN[save.wp],hp:100,mag:WPN[save.wp].mag,rel:0,cd:0,yaw:0,pitch:0.02,duck:false,dk:0,fire:false,time:0,pt:0,pz:0,phase:'fight',pT:0,en:[],gr:[],med:null,queue:[],spT:0.8,maxOn:2,boss:null,kills:0,mul:1+i*0.04,tsc:1-i*0.03,rec:0,fq:0,hitT:0,hurtT:0,bob:0,shots:0,hits:0};
  G.slots=buildStage(i); fxs=[]; startPoint(0); $('ovMenu').hidden=true; $('ovEnd').hidden=true; hud(); say(st.name); }
function startPoint(p){ var st=G.st, n=Math.min(13,5+si+p), i; G.pt=p; G.pz=-p*STEP; G.phase='fight'; G.queue=[]; G.maxOn=Math.min(4,2+((si+p)>>1)); G.spT=0.7; G.med=null;
  for(i=0;i<n;i++)G.queue.push(st.types[Math.floor(Math.random()*st.types.length)]);
  if(p===0&&si===0)G.queue=[0,0,0,0];
