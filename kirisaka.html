  '真壁|その瓶、見せてくれないか。',
  'ゆかり|え？　……ああ、これ、院長室にあったのを持ってきたんです。もったいないなって。',
  '院長が死んだ机の上の瓶だ。私は首を振った。\n「飲まないほうがいい。誰も」',
  'ゆかり|……こわいこと言わないでくださいよ。じゃあ、戻しておきますね。事務長に鍵、借りて。',
  '彼女は瓶を抱えて出ていった。その横顔が一瞬こわばったのを、私は見逃さなかった。'],to:'c3'},
c3:{chap:'c3',bg:'corridor',ch:'',L:['朝まで時間はある。私は館を歩き、一人ずつ話を聞くことにした。'],C:HUB3},
c3r:{bg:'corridor',ch:'',L:['さて、次はどうしようか。'],C:HUB3},
t_reina:{bg:'lounge',ch:'reina',L:[
  '玲奈は暖炉の前で、脚を組んでいた。ドレスの裾から、白いふくらはぎがのぞく。',
  '玲奈|主人とは二十も離れていましたの。財産目当て、と皆さんおっしゃるわ。',
  '玲奈|でもね先生。あの人、最近、遺言を書き換えたの。どこにしまったのかしら……。',
  '彼女は身を乗り出し、私のネクタイの結び目を指でなおした。薔薇の香りが濃くなる。',
  '玲奈|税理士の先生なら、ご存じ？　……あとで、ゆっくり教えてくださらない？'],to:'c3r'},
t_saeko:{bg:'office',ch:'saeko',L:[
  '事務室。冴子は電卓を叩く手を止めなかった。',
  '冴子|破られた帳簿のページ？　知りません。院長はこの半年、何かを一人で調べていました。',
  '真壁|医療機器のリース料が、相場の倍だ。支払先は実在しますか。',
  '電卓の音が止まった。彼女は眼鏡を外し、初めて私をまっすぐ見た。',
  '冴子|……さすがですね。午前0時、地下の保管庫へいらして。本物の帳簿をお見せします。二人きりで。',
  '外したままの眼鏡。ほどけた一筋の髪。それが誘いなのか罠なのか、私には読めなかった。'],set:'invite',to:'c3r'},
t_mio:{bg:'room',ch:'mio',L:[
  '二階の病室。澪はベッドの上で膝を抱えていた。雷が光るたび、薄いガウンごしに肩が震える。',
  '澪|……こわいんです。雷じゃなくて。この館が。'],
  C:[{t:'となりに座り、黙って話を待つ',to:'t_mio_a',set:'trust'},{t:'「今夜、何か見なかったか」と問いつめる',to:'t_mio_b'}]},
t_mio_a:{bg:'room',ch:'mio',L:[
  '私はベッドの端に腰を下ろした。しばらくして、彼女の頭がそっと私の肩にもたれた。',
  '澪|……先生は、嘘をつかない人の匂いがします。',
  '澪|あとで、お話しします。もう少しだけ、勇気が出たら。'],to:'c3r'},
t_mio_b:{bg:'room',ch:'mio',L:[
  '澪|……見てません。なにも。',
  '彼女はシーツを引き上げ、背を向けてしまった。扉は閉じた。たぶん、心のほうも。'],to:'c3r'},
t_yukari:{bg:'corridor',ch:'yukari',L:[
  'ナースステーション。ゆかりは包帯を巻きなおしながら、鼻歌をうたっていた。',
  'ゆかり|十時半？　あたし、ずっとここにいましたよ。カルテの整理してて。',
  'ゆかり|院長はね、いい先生でしたよ。……患者さんが死んでも、ぜったい自分のせいにしない、いい先生。',
  '笑顔のまま、彼女は包帯をきつく、きつく結んだ。',
  'ゆかり|先生も肩こってますね。もんであげます。……ほら、力ぬいて。',
  '背中に体温が押しつけられる。耳もとで、柑橘の香りがした。'],to:'c3r'},
t_lib:{bg:'office',ch:'',L:[
  '図書室。医学書の列の中に一冊だけ、背表紙のない帳面があった。院長の日記だ。',
  '「七月が来るたびに眠れない。あの夜、私は検査結果を見落とした。そして――恐ろしくなった」',
  '「償う方法を、ずっと考えている。金ではない。だが金のほかに、私に何が遺せるだろう」',
  '最後のページには、こうあった。\n「番号は、私が一生忘れてはならない日にした」'],to:'c3r'},
t_memo:{bg:'room',ch:'',L:[
  '自室で、預かっていた決算書の写しを広げた。数字は嘘をつかない。嘘をつくのは、いつも人だ。',
  '気になる科目が三つある。いちばんおかしいのは――'],C:MEMO},
t_memo2:{bg:'room',ch:'',L:['もう一度、数字を見直す。いちばんおかしいのは――'],C:MEMO},
t_memo_ng:{bg:'room',ch:'',L:['いや、これは説明がつく。……本当におかしいのは、別の科目だ。'],to:'t_memo2'},
t_memo_ok:{bg:'room',ch:'',L:[
  'リース料。機械は増えていないのに、支払いだけが倍だ。払った先は、設立二年の聞いたことのない会社。',
  '誰かが、この館から金を抜いている。',
  'だが――これは、人を殺すほどの額だろうか。私には、そうは思えなかった。'],to:'c3r'},
c4:{chap:'c4',bg:'corridor',ch:'',L:[
  '午前0時。館の時計が鳴った。',
  '破り取られた帳簿のページ。あれが見つかれば、院長が何を調べていたのかが分かる。'],
  C:[{t:'約束どおり、冴子と二人で保管庫へ行く',to:'b3',if:['invite']},{t:'ひとりで地下の資料室を探る',to:'b2'},{t:'今夜は動かず、自室に戻る',to:'c5'},{t:'冴子が来る前に、保管庫を自分で開ける',to:'c4b',mem:'M3'}]},
b3:{bg:'basement',ch:'saeko',L:[
  '地下の廊下の突き当たり。冴子は暗証番号を打ちこんだ。指の動きが見えた。――2、9、0、6。',
  '重い扉が開く。冷気。薬品と書類の棚。',
  '冴子|奥の棚です。どうぞ。',
  '!一歩入った瞬間、背中を押された。扉が閉まる。',
  '冴子|ごめんなさい。朝には出してあげます。それまでに、私は消えますから。',
  'だが彼女は知らなかった。この古い冷却装置は、一度閉めると温度が下がり続けることを。',
  'まぶたが重い。2906。2906。それだけを、私は繰り返していた。'],
  end:{id:'b3',mem:'M3',hint:'冴子は人殺しではない。だが、ついて行ってはいけない。番号はもう覚えた。'}},
b2:{bg:'basement',ch:'',L:[
  '隠すなら地下の資料室だろう。私は懐中電灯を手に、ひとり階段を下りた。',
  '中ほどまで来たとき、背後で床が、きゅっ、と鳴った。ナースシューズの音だ。',
  '!ふり返る前に、背中に両手が当たった。',
  '落ちていくあいだ、柑橘の匂いがした。そして、震える声を聞いた。',
  '「……ごめんなさい。ごめんなさい、先生」',
  'その声の主を、私は知っている。'],
  end:{id:'b2',mem:'M2',hint:'夜中にひとりで動くのは危険だ。だが、あの声は……本当は殺したくなかったのだ。'}},
c4b:{bg:'basement',ch:'',L:[
  '2906。指が覚えていた。なぜ知っているのか、自分でも説明できない。',
  '保管庫の奥、「リース契約」と書かれた箱の底に、本物の帳簿があった。架空リースで消えた金は、冴子の横領だ。',
  'だが、帳簿のあいだに挟まっていたのは、金とは関係のない一枚だった。古いカルテの写しだ。',
  '「三年前の7月14日　早瀬美咲（入院患者）死亡」\n欄外に、几帳面な字。「院長指示により差し替え。原本の写しをここに保管」',
  '!早瀬。看護師のゆかりと、同じ姓だ。'],set:'E2',to:'c5'},
c5:{chap:'c5',bg:'room',ch:'reina2',L:[
  '午前一時。自室のドアが、控えめに叩かれた。',
  'ドアの外に玲奈が立っていた。白衣はない。肩紐の細いナイトドレス一枚に、ワインの瓶とグラスを二つ。',
  '玲奈|眠れなくて。……先生も、でしょう？　入れてくださる？'],
  C:[{t:'招き入れ、ワインを受け取る',to:'b4'},{t:'「今夜は誰も信用できません」とドアを開けない',to:'c6'},{t:'招き入れるが、ワインには口をつけない',to:'c5b',mem:'M4'}]},
b4:{bg:'room',ch:'reina2',L:[
  '彼女はベッドの端に座り、私のグラスに赤を注いだ。肩紐が片方、すべり落ちる。直そうともしない。',
  '玲奈|さびしい夜は、きらい。',
  '唇が近づく。ワインは甘く、彼女の指は冷たく、私のまぶたは――不自然なほど、重かった。',
  '薄れる意識の中で、彼女が私の鞄を開ける音がした。',
  '玲奈|遺言の写し……どこ？　先生、預かっているんでしょう？　……あら。少し、薬が多かったかしら。',
  '彼女の胸もとで、小さな鍵が揺れていた。院長室のマスターキーだ。それが、私の見た最後のものになった。'],
  end:{id:'b4',mem:'M4',hint:'玲奈の目的は遺言だ。飲まずに話を聞けば、味方にできるかもしれない。'}},
c5b:{bg:'room',ch:'reina2',L:[
  '彼女を招き入れ、グラスは受け取った。だが、口はつけない。',
  '真壁|睡眠薬入りのワインで眠らせて、鞄から遺言の写しを探す。……そんなことをしなくても、私は持っていませんよ。',
  '玲奈の手が止まった。それから、ふっと肩の力が抜けた。すべり落ちた肩紐を、今度は自分で直す。',
  '玲奈|……こわい人。でも、きらいじゃないわ。',
  '玲奈|私は主人を殺していない。新しい遺言で全部失うかもしれなかった、それだけ。信じてくださる？',
  '彼女は首から細い鎖を外し、私の手のひらに落とした。まだ体温の残る、小さな鍵。',
  '玲奈|院長室のマスターキー。犯人を見つけて。……お礼は、そのあとで、ゆっくり。'],set:'key',to:'c6'},
c6:{chap:'c6',bg:'corridor',ch:'',L:['午前二時。館は静まり返っている。夜明けまで、あと三時間。'],C:HUB6},
c6r:{bg:'corridor',ch:'',L:['廊下に戻った。館は、息をひそめているようだ。'],C:HUB6},
c6o:{bg:'office',ch:'',L:[
  'マスターキーが回った。院長室は、あのときのままだ。',
  '机の上に、ブランデーの瓶が戻されている。壁には、小さな金庫が埋めこまれていた。'],C:OFF},
c6oo:{bg:'office',ch:'',L:['ほかに、調べておくべきものは。'],C:OFF},
c6o2:{bg:'office',ch:'',L:[
  'コルクを光にかざす。中心に、針で刺したような小さな穴があった。',
  '!封を切る前の瓶に、注射器で毒を入れたのだ。',
  '注射器を自然に持ち歩ける人間は、この館に限られている。'],set:'E1',to:'c6oo'},
c6s:{bg:'office',ch:'',L:[
  'ダイヤル式の金庫だ。番号は四けた。',
  '扉に、院長の字の付箋が貼ってある。\n「番号は、私が一生忘れてはならない日」'],code:{ans:'0714',ok:'c6s2',ng:'c6s_ng',cancel:'c6oo'}},
c6s_ng:{bg:'office',ch:'',L:['開かない。……院長が忘れてはならない日。その手がかりを、私はまだ持っていないのかもしれない。'],to:'c6oo'},
c6s2:{bg:'office',ch:'',L:[
  '!かちり、と音がして、扉が開いた。',
  '中には封筒が二通。一通は「遺言書」。もう一通の表には、こう書かれていた。\n「早瀬ゆかり様」',
  'その下に、破り取られていた帳簿のページ。破ったのは、院長自身だったのだ。',
  '私は二通の封筒を、上着の内ポケットにしまった。これは、朝まで私が預かる。'],set:'WILL',to:'c6oo'},
c6m:{bg:'room',ch:'mio',L:[
  '澪の病室。ノックの前に、ドアが開いた。',
  '澪|……来てくれると、思ってました。',
  '!雷が鳴った。彼女は小さく叫んで、私の胸にしがみついた。薄い布ごしに、速い鼓動が伝わってくる。',
  '澪|十時半ごろ、廊下で見たんです。院長室のほうへ歩いていく人を。……瓶を、抱えていました。',
  '澪|ゆかりさん、でした。あの人、私にだけはやさしいから……言えなくて。',
  '「ずっとナースステーションにいた」という証言は、嘘だった。',
  '澪|先生。……もう少しだけ、こうしていても、いいですか。'],set:'E3',to:'c6r'},
c65:{chap:'c65',bg:'dark',ch:'',L:[
  '!午前三時。ふいに、すべての灯りが消えた。',
  '非常灯もつかない。窓の外の稲妻だけが、廊下を一瞬ずつ切り取っていく。',
  '!二階から、女の悲鳴が聞こえた。'],
  C:[{t:'悲鳴のした二階へ走る',to:'n_scream'},{t:'澪の病室へ向かう',to:'n_mio3'},{t:'まっすぐ地下の保管庫へ走る',to:'vdoor',mem:'M5'}]},
n_scream:{bg:'dark',ch:'reina2',L:[
  '暗闇の中で、やわらかいものが胸に飛びこんできた。薔薇の香り。玲奈だ。',
  '玲奈|だれかが……だれかが廊下を走っていったの。こわい……離さないで。',
  '細い肩が震えている。ナイトドレスごしの体温が、やけに熱い。私はしばらく、その背中を抱いていた。',
  '三十分ほどして、灯りが戻った。',
  'ゆかり|ブレーカー、上げてきましたよー。古い建物はこれだから。……あれ？　事務長、見ませんでした？'],to:'n_dead'},
n_dead:{bg:'basement',ch:'',L:[
  '冴子の姿がどこにもない。私たちは手分けして館を探した。',
  '地下の保管庫の前で、玲奈が足を止めた。扉のすき間から、白い冷気が流れ出している。',
  '玲奈が、院長から聞いていた非常用の番号で扉を開けた。',
  '!冴子は、棚にもたれて座っていた。眼鏡に霜がついている。もう、息はなかった。',
  '内側の扉には、爪でひっかいた跡が何本も残っていた。停電のあいだ、彼女はずっとここにいたのだ。'],mem:'M5',set:'saeDead',to:'c66'},
n_mio3:{bg:'dark',ch:'mio',L:[
  '澪はベッドの上で、毛布をかぶって震えていた。私の手を探りあて、両手で握りしめる。',
  '澪|先生……下から、音がするんです。ずっと。だれかが、叩いてるみたいな……。',
  '耳をすます。たしかに聞こえる。床のずっと下から、鈍く、弱く。',
  '私は彼女の手をそっとほどき、階段へ走った。'],to:'vdoor'},
vdoor:{bg:'basement',ch:'',L:[
  '地下の保管庫。扉の向こうから、弱々しく叩く音がする。',
  '「……だれか……」\n冴子の声だ。'],
  C:[{t:'暗証番号を打ちこむ',to:'v0',mem:'M3'},{t:'扉を力ずくでこじ開ける',to:'b11'}]},
b11:{bg:'basement',ch:'',L:[
  '取っ手を引く。びくともしない。番号を知らない私には、この扉はただの鉄の壁だ。',
  '叩く音が、だんだん弱くなっていく。',
  '夢中で扉に体当たりしていた私は、背後の、きゅっ、という足音に気づくのが遅れた。',
  '!首すじに、冷たい針が入った。',
  '「……先生まで、来ちゃだめじゃないですか」'],
  end:{id:'b11',hint:'力では開かない。番号が要る。番号を知る機会は、午前0時にあった。'}},
v0:{bg:'vault',ch:'saeko2',L:[
  '2、9、0、6。扉が開いた。冷気が顔を打つ。',
  '冴子は棚にもたれて、ぐったりと座っていた。唇が青い。だが、息はある。',
  '駆けよって抱き起こした、そのときだった。',
  '!背後で、重い扉が閉まった。',
  '扉の向こうから、くぐもった声がした。\n「……ごめんね、先生。二人で、静かにしてて」',
  '冷却装置のうなりが、一段高くなった。'],to:'v1'},
v1:{chap:'v1',bg:'vault',ch:'saeko2',reset:'cold',L:['閉じこめられた。温度はどんどん下がっていく。体が動くうちに、ここを出なければ。'],C:VH},
v1r:{bg:'vault',ch:'saeko2',limit:{max:7,to:'b12'},L:['息が白い。（寒さの限界まで、あと {cold} 手）'],C:VH},
v_wrap:{bg:'vault',ch:'saeko2',L:[
  '上着を脱いで彼女の肩にかけ、冷えきった体を抱きよせた。細い。こんなに細い人だったのか。',
  '冴子|……あたたかい。……ごめんなさい、私、あなたを、だまそうと……。',
  '冴子|扉の、右下……非常用の解除パネルが……番号は、点検のたびに、変えるんです……。',
  'それだけ言うと、彼女は私の胸に額を押しつけて、目を閉じた。'],to:'v1r'},
v_door:{bg:'vault',ch:'saeko2',L:[
  '扉の右下に、小さなふた。開けると、数字のボタンが並んでいた。非常用の解除パネルだ。四けた。',
  'でたらめに押している時間はない。番号の手がかりが、どこかにあるはずだ。'],to:'v1r'},
v_shelf:{bg:'vault',ch:'saeko2',L:[
  '薬品の箱、古い書類。その奥に、懐中電灯が転がっていた。つく。',
  '光の輪の中で、自分の息がまっ白に見えた。'],set:'light',to:'v1r'},
v_vent:{bg:'vault',ch:'saeko2',L:[
  '棚によじのぼって換気口に手をのばす。鉄の格子は、びくともしなかった。',
  '指先の感覚が、もうほとんどない。'],to:'v1r'},
v_floor_dark:{bg:'vault',ch:'saeko2',L:['床に手をついて探る。暗くて、何も見えない。指がかじかむだけだった。'],to:'v1r'},
v_floor:{bg:'vault',ch:'saeko2',L:[
  '懐中電灯で床を照らす。棚の下に、紙が一枚落ちていた。',
  '「冷却装置　点検票　前回点検：3月12日　担当：黒木」',
  'その下に、几帳面な字で書きそえてある。\n「※解除番号は、点検日を逆さに読むこと」'],to:'v1r'},
v_code:{bg:'vault',ch:'saeko2',L:['解除パネルの前にひざをつく。四けたの番号を入れる。'],code:{ans:'2130',ok:'v9',ng:'v_ng',cancel:'v1r'}},
v_ng:{bg:'vault',ch:'saeko2',addcold:1,L:['赤いランプがついた。ちがう。'],to:'v1r'},
b12:{bg:'vault',ch:'saeko2',L:[
  'もう、指が動かない。',
  '私は冴子を抱いたまま、棚にもたれて座りこんだ。彼女の髪が、ほおに冷たい。',
  '冴子|……ねえ。合わない数字、ひとつだけ……あなたに、直してほしかった……。',
  '眠い。ひどく眠い。二人ぶんの白い息が、少しずつ、小さくなっていった。'],
  end:{id:'b12',hint:'動ける手数には限りがある。まず明かりを手に入れ、それから床を照らそう。'}},
v9:{bg:'lounge',ch:'saeko2',L:[
  '!緑のランプ。扉が、開いた。',
  '冴子を背負って階段を上がる。ブレーカーを上げると、館に灯りが戻った。',
  'ラウンジの暖炉の前。毛布にくるまった冴子は、割れた眼鏡を握りしめていた。',
  '冴子|……見ないでください。眼鏡がないと、私、ひどい顔なんです。',
  '真壁|そんなことはない。',
  '冴子|……三年前のカルテを書き換えたのは、私です。院長に命じられて。原本の写しは、こわくて捨てられなかった。',
  '冴子|あの子は、それを知っています。だから私を……。先生、あの子を、止めてあげて。',
  '毛布の中から伸びた手が、私の手を握った。まだ冷たい。けれど、もう震えてはいなかった。'],set:'saeAlive',to:'c66'},
c66:{chap:'c66',bg:'corridor',ch:'yukari',L:[
  '午前四時。廊下の窓が、わずかに青くなりはじめていた。',
  'ゆかり|先生。……ちょっと、いいですか。',
  'いつもの笑顔だ。だが、目の下が赤い。',
  'ゆかり|屋上、行きません？　雨、やんできたし。二人きりで、話したいことがあるんです。'],
  C:[{t:'ついて行く',to:'b13'},{t:'「話は朝、みんなの前で聞くよ」',to:'c7pre'}]},
b13:{bg:'roof',ch:'yukari2',L:[
  '屋上は風が強かった。ゆかりは手すりにもたれ、ナースキャップを外した。ほどけた髪が流れる。',
  'ゆかり|先生ってさ、やさしいよね。数字ばっか見てるくせに、人のこと、ちゃんと見てる。',
  '彼女は一歩近づき、背伸びをして、私の唇に自分の唇を重ねた。柑橘の香り。少し、しょっぱい。',
  'ゆかり|……あたしね、先生みたいな人に、三年前に会いたかった。',
  '!わき腹に、ちくりと痛みが走った。',
  'ゆかり|ごめんね。ほんとに、ごめん。……きらいじゃ、なかったのにな。',
  'ひざが崩れる。明けていく空を背に、彼女は泣きながら笑っていた。'],
  end:{id:'b13',hint:'彼女と二人きりになってはいけない。話は、みんなの前で。'}},
c7pre:{bg:'corridor',ch:'yukari',L:[
  'ゆかり|……そっか。うん、そうだよね。',
  '彼女は笑って手をふり、廊下の角に消えた。その背中が、ひどく小さく見えた。'],to:['saeDead','c7d','c7']},
c7:{chap:'c7',bg:'lounge',ch:'',L:[
  '午前五時。雨は小降りになっていた。私は全員をラウンジに集めた。',
  '四人の目が私を見ている。告発する相手をまちがえることは、許されない。'],C:ACC},
c7d:{chap:'c7',bg:'lounge',ch:'',L:[
  '午前五時。雨は小降りになっていた。私は残った全員をラウンジに集めた。',
  '三人の目が私を見ている。ソファのひとつは、空いたままだ。告発する相手をまちがえることは、許されない。'],C:ACC},
b6:{bg:'lounge',ch:'reina',L:[
  '真壁|犯人はあなただ、玲奈さん。動機は遺産です。',
  '玲奈は否定しなかった。ただ、ひどく悲しそうに笑った。\n「そう見えるでしょうね」',
  '朝、警察が来て、彼女は連れて行かれた。私は役目を終えたつもりで、帰りの車に乗った。',
  '助手席に、差し入れだという水筒があった。柑橘の香りのする、あたたかいお茶だった。',
  '!橋の手前で、ハンドルを握る指がしびれはじめた。'],
  end:{id:'b6',hint:'遺産という動機は分かりやすすぎる。毒を入れた「方法」から考えよう。'}},
b7:{bg:'lounge',ch:'saeko',L:[
  '真壁|架空リースで金を抜いていたのは、あなただ。発覚をおそれて院長を――',
  '冴子|横領は認めます。でも、殺してはいない！',
  '彼女は警察に引き渡された。事件は終わった――はずだった。',
  '半年後、私は新聞の小さな記事を読んだ。霧坂クリニックで、また一人、入院患者が死んだという。',
  '白石澪。死因は、薬の取り違え。……あの夜、何かを言いたそうだった瞳を、私は思い出した。'],
  end:{id:'b7',hint:'金の流れと人殺しは別の話だ。人を殺すほどの理由は、金ではないところにある。'}},
b8:{bg:'lounge',ch:'mio',L:[
  '真壁|ずっと入院している君なら、館のことは誰より知っている。',
  '澪は何も言わなかった。大きな瞳から、涙がひとつ落ちただけだった。',
  'その夜、彼女は屋上から消えた。遺書はなかった。',
  '私は一生、あの涙の意味を考えつづけることになる。真犯人が、まだ笑っているとも知らずに。'],
  end:{id:'b8',hint:'彼女は犯人ではなく、目撃者だ。問いつめず、信じて待てば話してくれる。'}},
b9:{bg:'lounge',ch:'yukari',L:[
  '真壁|犯人は君だ、早瀬さん。',
  'ゆかり|えーっ、あたし？　ひどいなあ先生。……証拠は？',
  '言葉につまった。私の手の中には、決め手が足りない。',
  'ゆかり|ね、ないでしょ。先生、つかれてるんですよ。お注射、してあげますね。',
  '!笑顔のまま、彼女は私の首すじに手をそえた。ちくり、とした。柑橘の香りが、最後だった。'],
  end:{id:'b9',hint:'相手は合っている。足りないのは証拠だ。必要なのは三つ――毒の入れ方、動機の記録、目撃証言。'}},
q1:{bg:'lounge',ch:'yukari',bgm:'tension',L:[
  '真壁|犯人は君だ、早瀬ゆかりさん。',
  'ゆかり|えーっ、あたし？　ひどいなあ先生。……じゃあ聞かせてくださいよ。毒は、いつ、どうやって？'],
  C:[{t:'「院長のグラスに、直接入れた」',to:'b10'},{t:'「封を切る前の瓶に、コルクごしに注射器で入れた」',to:'q2'},{t:'「夕食の料理に混ぜた」',to:'b10'}]},
q2:{bg:'lounge',ch:'yukari',bgm:'tension',L:[
  '真壁|コルクの中心に、針の穴があった。注射器を持ち歩いて怪しまれないのは、看護師の君だけだ。',
  'ゆかり|……ふうん。でも、あたしが院長を殺す理由なんて、ないですよ？'],
  C:[{t:'「遺産の分け前だ」',to:'b10'},{t:'「三年前の七月十四日。早瀬美咲さんの死だ」',to:'q3'},{t:'「横領を知られたからだ」',to:'b10'}]},
q3:{bg:'lounge',ch:'yukari',bgm:'tension',L:[
  '真壁|早瀬美咲。君のお姉さんだ。院長は誤診を隠し、カルテを差し替えさせた。',
  'ゆかりの笑顔が、ゆっくりと消えた。',
  'ゆかり|……証拠は、それだけ？　あたしが院長室に行ったって、だれが言えるの。'],
  C:[{t:'「瓶に、君の指紋が残っている」',to:'b10'},{t:'「君は『ずっとナースステーションにいた』と言った。だが十時半、瓶を抱えた君を見た人がいる」',to:'c8'},{t:'「院長室に、君の香水が残っていた」',to:'b10'}]},
b10:{bg:'lounge',ch:'yukari',L:[
  'ゆかり|……先生、それ、ちがいますよ。',
  '一瞬の沈黙。それで十分だった。場の空気が、私から離れていくのが分かった。',
  '玲奈|先生……お疲れなのよ。少し、休まれたら。',
  'その日の昼、橋が直る前に、私は「過労で倒れた」ことになった。腕には、覚えのない注射のあとがあった。'],
  end:{id:'b10',hint:'推理はひとつでも外すと崩れる。自分の目で確かめたことだけを、順に並べよう。'}},
c8:{bg:'lounge',ch:'yukari',bgm:'danger',L:[
  '澪が、小さく手をあげた。\n「……私が、見ました」',
  '長い沈黙のあと、ゆかりは息を吐いた。',
  'ゆかり|……お姉ちゃんはね、あの人の誤診で死んだの。なのにカルテを書き換えて、「手は尽くした」って。',
  'ゆかり|三年かけて、ここに入りこんだ。やっと終わったのに。……先生、なんで来ちゃったかなあ。',
  '!彼女はポケットから注射器を取り出した。針先は、私ではなく、自分の首に向いていた。'],
  C:[{t:'飛びかかって注射器を奪う',to:'en'},{t:'「階段で、君は泣いて謝っていた」と語りかける',to:'c9',mem:'M2'}]},
en:{bg:'lounge',ch:'yukari',L:[
  '私は飛びかかった。だが、彼女のほうが一瞬早かった。',
  'ゆかり|……ごめんね、先生。肩、もっともんであげたかったな。',
  '朝日がラウンジに差しこんだとき、事件は終わっていた。犯人は分かった。謎も解けた。',
  'それでも私は、何かをひとつ、取りこぼした気がしてならなかった。'],
  end:{id:'en',hint:'真相には届いた。だが、彼女を止める言葉をあなたはまだ知らない。彼女の本心が聞こえる結末が、どこかにある。'}},
c9:{bg:'lounge',ch:'yukari',bgm:'none',L:[
  '真壁|階段で、君は泣いて謝っていた。「ごめんなさい、先生」と。',
  'ゆかり|……え？　なに、言って……そんなこと、あたし、まだ――',
  '真壁|君は、人を殺して平気でいられる人間じゃない。お姉さんは、妹にそんな最期を望むだろうか。',

eg:{bg:'dawn',ch:'yukari',L:[
  '注射器が、床に落ちて転がった。',
  'ゆかりはその場に座りこみ、声を出さずに泣いた。',
  '橋は昼前に仮復旧した。パトカーに乗る前、彼女は一度だけふり返った。',
  'ゆかり|……あの人、最後まで謝らなかったな。一回でいいから、聞きたかった。「すまなかった」って。',
  'その言葉を、私は長いあいだ忘れられなかった。院長は本当に、何も遺さなかったのだろうか。'],
  end:{id:'eg',hint:'彼女は生きて朝を迎えた。だが、まだ届いていないものがある。院長が「遺したもの」を探そう。そして今夜は、もう誰も死なせないこと。'}},
et1:{bg:'dawn',ch:'yukari',L:[
  '真壁|それに――君に、渡さなければならないものがある。',
  '私は上着の内ポケットから、封筒を取り出した。院長室の金庫にあったものだ。表には「早瀬ゆかり様」。',
  'ゆかり|……なに、それ。',
  '「君がだれの妹か、私は一年前に気づいた。三年前の七月十四日、私は誤った。そして恐れて、記録を偽らせた」',
  '「君がここへ来た理由も、分かっているつもりだ。私は逃げない。明日、すべてを公にする。そのために、税理士の先生を呼んだ」',
  '「クリニックの財産はすべて、美咲さんのご遺族に遺す。金で償えるとは思わない。だが、ほかに私には何も遺せない」',
  '「すまなかった。本当に、すまなかった」',
  '!注射器が、床に落ちて転がった。',
  'ゆかり|……ずるいよ。……一日、たった一日、待ってたら……。',
  'ゆかりは子どものように声を上げて泣いた。玲奈がその肩を抱き、冴子が見えない目をしばたたかせ、澪が小さな手で背中をさすった。',
  '橋は昼前に仮復旧した。パトカーに乗る前、ゆかりはふり返って、ほんの少しだけ笑った。',
  'ゆかり|先生。……出てきたら、今度はちゃんと、お酒おごらせてくださいね。毒ぬきで。',
  '霧が晴れていく。長い夜だった。私は、帳簿を閉じた。',
  '一か月後。事務所に、一通の便りが届いた。差出人は――'],
  C:[{t:'霧坂玲奈',to:'ep_r'},{t:'黒木冴子',to:'ep_s'},{t:'白石澪',to:'ep_m'}]},
ep_r:{bg:'dawn',ch:'reina',L:[
  '玲奈|お礼は、そのあとでゆっくり――そう申し上げたでしょう？',
  '指定されたのは、海の見えるホテルのバーだった。彼女は黒いドレスで、もう白衣は着ていない。',

  '玲奈|ねえ先生。開業の手続き、教えてくださる？　……今夜は、ワインに何も入れていないから。',
  'グラスが触れあった。薔薇の香りが、ゆっくりと近づいてきた。'],
  end:{id:'et',epi:'r',hint:'おめでとうございます。真相と、もうひとつ大事なものにたどり着きました。便りの差出人は三人います。ほかの結末も、フローチャートから探せます。'}},
ep_s:{bg:'dawn',ch:'saeko',L:[

  '冴子|執行猶予がつきました。横領した分は、全額返します。何年かかっても。',
  '新しい眼鏡をかけた彼女は、事務所の入口で、背筋をのばして立っていた。',

  '真壁|給料は安いよ。',
  '冴子|かまいません。……そのかわり、残業のあとは、食事に連れていってください。二人きりで。',
  '耳まで赤くして、彼女は初めて、声を出して笑った。'],
  end:{id:'et',epi:'s',hint:'おめでとうございます。真相と、もうひとつ大事なものにたどり着きました。便りの差出人は三人います。ほかの結末も、フローチャートから探せます。'}},
ep_m:{bg:'dawn',ch:'mio',L:[
  '封筒の中には、押し花が一枚。それと、たどたどしい字の手紙。',
  '「退院しました。こわくて言えなかったことを言えたら、熱が下がったんです。ふしぎですね」',
  'その週末、事務所のドアが控えめに叩かれた。白いガウンではなく、白いワンピースの澪が、花束を抱えて立っていた。',
  '澪|……先生は、やっぱり、嘘をつかない人の匂いがします。',

  else if(n.end)showEnd(n.end);
  else if(n.to)go(n.to);
}
function showChoices(n){
  waitChoice=true; $('more').hidden=true; var box=$('choices'); box.innerHTML='';
  n.C.forEach(function(c){
    if(c.once&&flags[c.once])return; if(c.if&&!all(c.if))return; if(c.unless&&all(c.unless))return;
    var b=document.createElement('button'), locked=c.mem&&!save.mem[c.mem];
    if(locked){ b.className='lock'; b.disabled=true; b.textContent='🔒 ？？？（いまの私には思いつかない）'; }
    else { b.textContent=(c.mem?'◆ ':'')+c.t; b.onclick=function(e){ e.stopPropagation(); seClick(); lastChoice={node:cur,flags:copy(flags),chap:curChap}; if(c.once)flags[c.once]=1; if(c.set)flags[c.set]=1; if(c.cost)flags.cold=(flags.cold||0)+c.cost; go(c.to); }; }
    box.appendChild(b);
  });
}
/* 四けたの番号を入れる場面 */
function showCode(n){
  waitChoice=true; $('more').hidden=true; $('box').className='code'; var box=$('choices'); box.innerHTML=''; var val='';
  var disp=document.createElement('div'); disp.className='digits'; var pad=document.createElement('div'); pad.className='pad';
  function draw(){ disp.textContent=(val+'____').slice(0,4); }
  ['1','2','3','4','5','6','7','8','9','消す','0','決定'].forEach(function(k){ var b=document.createElement('button'); b.textContent=k; if(k==='決定')b.className='main';
    b.onclick=function(e){ e.stopPropagation(); seClick(); if(k==='消す'){ val=val.slice(0,-1); draw(); } else if(k==='決定'){ if(val.length<4)return; if(val===n.code.ans){ seGood(); go(n.code.ok); } else go(n.code.ng); } else if(val.length<4){ val+=k; draw(); } }; pad.appendChild(b); });
  var c=document.createElement('button'); c.textContent='やめる'; c.onclick=function(e){ e.stopPropagation(); go(n.code.cancel); };
  box.appendChild(disp); box.appendChild(pad); box.appendChild(c); draw();
}
function endInfo(id){ for(var i=0;i<ENDS.length;i++)if(ENDS[i][0]===id)return ENDS[i]; return null; }
function progText(){ return '結末 '+count(save.ends)+' / '+ENDS.length+'　記憶 '+count(save.mem)+' / '+MKEYS.length+'　後日談 '+count(save.epi)+' / 3'; }
function showEnd(e){
  ended=true; var inf=endInfo(e.id), k=inf[2], newMem=e.mem&&!save.mem[e.mem];
  save.ends[e.id]=1; if(e.mem)save.mem[e.mem]=1; if(e.epi)save.epi[e.epi]=1; store();
  bgm.want=k==='t'?'dawn':'none'; if(k==='b')seBad(); else if(k==='t'||k==='g')seGood();
  $('endKind').textContent=KIND[k]; $('endKind').style.color=KCOL[k];
  $('endTitle').textContent='「'+inf[3]+'」';
  var m=$('endMem'); m.hidden=!e.mem; if(e.mem)m.innerHTML=(newMem?'<b>新しい記憶を得た</b><br>':'<b>記憶</b>（すでに持っている）<br>')+MEM[e.mem];
  $('endHint').innerHTML='<b>'+(k==='t'?'あとがき':'ヒント')+'</b><br>'+e.hint+'<br><span style="color:var(--dim)">'+progText()+'</span>';
  $('btnRetry').hidden=!lastChoice; $('ovEnd').hidden=false;
}
function startNew(){ flags={}; curChap=''; lastChoice=null; hideAll(); go('p0'); }
function jump(ch){ flags=copy(save.chap[ch]||{}); curChap=''; lastChoice=null; hideAll(); go(ch==='c7'&&flags.saeDead?'c7d':ch); }
function hideAll(){ $('ovTitle').hidden=true; $('ovEnd').hidden=true; $('ovFlow').hidden=true; }
function showTitle(){ hideAll(); bgm.want='calm'; $('btnCont').disabled=!save.last; $('prog').textContent=progText(); $('ovTitle').hidden=false; }
var wipeStep=0;
function showFlow(){
  var f=$('flow'); f.innerHTML='';
  CHAPS.forEach(function(c){
    var row=document.createElement('div'); row.className='ch'; var b=document.createElement('button'), ok=!!save.chap[c[0]];
    b.textContent=ok?c[1]:'？？？（まだたどり着いていない）'; b.disabled=!ok; b.onclick=function(){ jump(c[0]); }; row.appendChild(b); f.appendChild(row);
    ENDS.forEach(function(e){ if(e[1]!==c[0])return; var d=document.createElement('div'), seen=!!save.ends[e[0]]; d.className='en'+(seen?' seen':'');
      d.innerHTML='<span class="tag '+e[2]+'">'+KSHORT[e[2]]+'</span>'+(seen?e[3]:'？？？'); f.appendChild(d); });
  });
  var ml=''; MKEYS.forEach(function(k,i){ ml+=(i?'<br>':'')+(save.mem[k]?'◆ '+MEM[k]:'◇ ？？？'); }); $('memList').innerHTML=ml;
  wipeStep=0; $('btnWipe').textContent='記録をすべて消す';
  $('ovEnd').hidden=true; $('ovFlow').hidden=false;
}
$('box').onclick=next; $('stage').onclick=next;
window.addEventListener('keydown',function(e){ if((e.key===' '||e.key==='Enter')&&$('ovTitle').hidden&&$('ovEnd').hidden&&$('ovFlow').hidden){ e.preventDefault(); next(); } });
$('btnStart').onclick=startNew;
$('btnCont').onclick=function(){ if(save.last)jump(save.last); };
$('btnFlow').onclick=showFlow; $('btnFlow2').onclick=showFlow; $('btnEndFlow').onclick=showFlow;
$('btnFlowClose').onclick=function(){ $('ovFlow').hidden=true; if(!cur||ended)showTitle(); };
$('btnEndTitle').onclick=showTitle;
$('btnRetry').onclick=function(){ if(!lastChoice)return; var lc=lastChoice; flags=copy(lc.flags); curChap=lc.chap; hideAll(); cur=lc.node; var n=N[cur]; li=n.L.length-1; ended=false; waitChoice=false;
  $('chapName').textContent=chapName(curChap); scene(n); $('choices').innerHTML=''; line(); };
$('btnWipe').onclick=function(){ if(wipeStep===0){ wipeStep=1; this.textContent='本当に消す？　もう一度押すと消えます'; return; } save={mem:{},ends:{},chap:{},epi:{},last:null}; store(); cur=null; showTitle(); };
/* 点検用 */
window.__k={N:N,ENDS:ENDS,save:function(){return save;},flags:function(){return flags;},cur:function(){return cur;},go:go,next:next,start:startNew,jump:jump,bgm:bgm,
  opts:function(){ return Array.prototype.map.call($('choices').querySelectorAll('button'),function(b){return (b.disabled?'[x]':'')+b.textContent;}); },
  skip:function(){ var g=0; while(!waitChoice&&!ended&&g++<600)next(); return cur; }};
showTitle();
})();
</script>
